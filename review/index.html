const D={"records": [{"id": "sistani-code-of-practice-west", "title": "A Code of Practice For Muslims in the West", "source": "sistani.org", "level": "intermediate", "tag": "fiqh", "gran": "work", "url": "https://www.sistani.org/english/book/46/", "authors": ["Sayyid Abdul Hadi al-Hakim"], "marja": "sistani", "note": "Level: the Editor's Note says the book aims to make fiqh easier for the layman, so intermediate was chosen rather than advanced; reviewer to confirm. Author is the compiler (Sayyid Abdul Hadi al-Hakim); rulings are Sayyid Sistani's, recorded in `marja`. title_original is the transliterated Arabic title given in the Author's Preface.", "desc": "A book of practical Islamic rulings (fiqh) written for Muslims living in non-Muslim countries, following the views of Sayyid Ali al-Sistani. Each chapter has a short introduction, general rules, and questions and answers, on topics such as prayer, fasting, food, work, marriage and medical issues.", "file": "data/records/sistani/sistani-code-of-practice-west.yaml", "cats": ["level", "ruling", "author"]}, {"id": "sistani-hajj-rituals-2093", "title": "Prohibitions during Ihram", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/47/2093/", "authors": [], "marja": "sistani", "note": "Includes rules on sexual conduct and related penalties for pilgrims in ihram; reviewer to confirm neutral wording.", "desc": "Lists the acts a pilgrim avoids once in ihram, such as hunting, perfume, certain clothing, covering the head, cutting hair and certain personal conduct, and what is owed if one of them is done.", "file": "data/records/sistani/sistani-hajj-rituals-2093.yaml", "cats": ["sexual", "sensitive"]}, {"id": "sistani-hajj-rituals", "title": "Hajj Rituals", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "work", "url": "https://www.sistani.org/english/book/47/", "authors": [], "marja": "sistani", "note": "No foreword, preface or author line on the contents page or the first page (https://www.sistani.org/english/book/47/2082/), so the author or compiler is not named (authors left empty; marja is sistani because the book is published on sistani.org). Level set to advanced because the book calls itself brief but gives no statement of intended audience; it is a detailed, numbered rule manual. Reviewer to confirm.", "desc": "A manual of the rulings (fiqh) for performing Hajj and Umrah, the pilgrimage to Mecca, presented as numbered rules on the site of Sayyid Ali al-Sistani. It runs from who the duty of Hajj applies to, through each stage of the pilgrimage, to recommended acts and supplications.", "file": "data/records/sistani/sistani-hajj-rituals.yaml", "cats": ["level", "author"]}, {"id": "sistani-jme-2397", "title": "Dialogue on Janabah", "source": "sistani.org", "level": "beginner", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/49/2397/", "authors": ["Sayyid Abdul Hadi al-Hakim"], "marja": "sistani", "note": "Sexual topics (janabah and related questions) are discussed in plain terms; reviewer to confirm the wording of the description is suitable.", "desc": "A dialogue on janabah (a state of major ritual impurity that follows sexual activity). Covers how it arises and related questions a young person might have, in plain, matter-of-fact terms.", "file": "data/records/sistani/sistani-jme-2397.yaml", "cats": ["sexual"]}, {"id": "sistani-jme-2422", "title": "Dialogue on miscellaneous issues-2", "source": "sistani.org", "level": "beginner", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/49/2422/", "authors": ["Sayyid Abdul Hadi al-Hakim"], "marja": "sistani", "note": "Covers sexual, reproductive and medical questions (family planning, pregnancy, organ and sperm donation, masturbation); reviewer to confirm neutral wording and heading choice.", "desc": "The second of two dialogues on miscellaneous issues, covering women's matters, medical treatment, family planning, modesty and dress, science and technology topics and organ donation.", "file": "data/records/sistani/sistani-jme-2422.yaml", "cats": ["sexual", "marriage", "heading"]}, {"id": "sistani-jme", "title": "Jurisprudence Made Easy", "source": "sistani.org", "level": "beginner", "tag": "fiqh", "gran": "work", "url": "https://www.sistani.org/english/book/49/", "authors": ["Sayyid Abdul Hadi al-Hakim"], "marja": "sistani", "note": "Level: Author's Preface says the book uses simple, familiar language for the laity and the up-and-coming generation, so beginner was chosen; reviewer to confirm. Author (Abdul Hadi Mohammad Taqi al-Hakim, per the Preface to the English edition, https://www.sistani.org/english/book/49/2390/) matched to scholars.yaml id abdul-hadi-al-hakim; the Arabic-edition introduction (https://www.sistani.org/english/book/49/2391/) says this edition was checked by Sayyid Sistani's office to conform to his edicts, hence marja: sistani. title_original is the transliterated Arabic title given in the Preface.", "desc": "A simplified guide to everyday Islamic rulings (fiqh) written for ordinary readers, following the views of Sayyid Ali al-Sistani. It is set out as conversations between a father and his teenage son on topics such as prayer, fasting, Hajj, khums (a religious payment), trade, marriage and inheritance.", "file": "data/records/sistani/sistani-jme.yaml", "cats": ["level", "author"]}, {"id": "sistani-laws-2134", "title": "IMPURITIES (NAJĀSĀT) » 8. Disbeliever (kāfir)", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2134/", "authors": ["Sayyid Ali al-Sistani"], "marja": "sistani", "note": "Concerns the classification of non-Muslims and sectarian matters; the topic is sensitive, so a knowledgeable human should confirm the neutral description and headings.", "desc": "Rules on how disbelievers (kafir) are treated in the section on impurities, including different categories of people, children, doubts about whether someone is a Muslim, and those who abuse the Imams.", "file": "data/records/sistani/sistani-laws-2134.yaml", "cats": ["faith", "heading", "sensitive"]}, {"id": "sistani-laws-2147", "title": "THINGS THAT PURIFY AN IMPURE OBJECT (MUṬAHHIRĀT) » 7. Islam", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2147/", "authors": ["Sayyid Ali al-Sistani"], "marja": "sistani", "note": "Concerns non-Muslims and conversion; the topic is sensitive, so a knowledgeable human should confirm the neutral description.", "desc": "Rules on how a person's becoming Muslim relates to purity, including the declaration of the two testimonies (shahadatayn) and what applies to their clothes and body.", "file": "data/records/sistani/sistani-laws-2147.yaml", "cats": ["faith", "sensitive"]}, {"id": "sistani-laws-2148", "title": "THINGS THAT PURIFY AN IMPURE OBJECT (MUṬAHHIRĀT) » 8. Subsequence (tabaʿiyyah)", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2148/", "authors": ["Sayyid Ali al-Sistani"], "marja": "sistani", "note": "Includes rulings about the children of non-Muslims; sensitive topic, so a knowledgeable human should confirm the neutral description.", "desc": "Rules on subsequence (tabaʿiyyah), where an impure object becomes pure by means of another object's purification. Examples include the container of wine that turns to vinegar, a disbeliever's child, and surfaces used for washing the dead.", "file": "data/records/sistani/sistani-laws-2148.yaml", "cats": ["faith", "ruling", "sensitive"]}, {"id": "sistani-laws-2162", "title": "LAWS OF RITUAL IMPURITY (JANĀBAH)", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2162/", "authors": ["Sayyid Ali al-Sistani"], "marja": "sistani", "note": "Concerns sexual matters; the description is kept to the topic, so a knowledgeable human should confirm the wording and headings.", "desc": "Rules on janabah (major ritual impurity): how a person enters this state, and doubts about discharged fluid and its type, for both men and women.", "file": "data/records/sistani/sistani-laws-2162.yaml", "cats": ["sexual", "heading"]}, {"id": "sistani-laws-2172", "title": "LAWS OF A WOMAN IN MENSTRUATION (ḤĀʾIḌ)", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2172/", "authors": ["Sayyid Ali al-Sistani"], "marja": "sistani", "note": "Includes rulings on sexual relations during menstruation; sensitive topic, so a knowledgeable human should confirm the wording and headings.", "desc": "Covers the laws for a woman during menstruation (haid): the acts of worship and other matters that are restricted for her, along with the matters of intercourse and what applies in different cases.", "file": "data/records/sistani/sistani-laws-2172.yaml", "cats": ["sexual", "ruling", "heading", "sensitive"]}, {"id": "sistani-laws-2269", "title": "CHAPTER THREE » Prayer (Ṣalāh) » CONDITIONS OF THE IMAM OF CONGREGATIONAL PRAYERS", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2269/", "authors": [], "marja": "sistani", "note": "Page states conditions on the imam's creed (Twelver Shia), a Shia-Sunni matter; flagged for human review.", "desc": "Covers the qualifications of the imam (prayer leader) of a congregational prayer, and rulings on following imams with excuses or illnesses.", "file": "data/records/sistani/sistani-laws-2269.yaml", "cats": ["sunni"]}, {"id": "sistani-laws-2281", "title": "CHAPTER FOUR » Fasting (Ṣawm) » THINGS THAT INVALIDATE (MUBṬILĀT) A FAST » 2. Sexual intercourse", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.o agged for review.", "desc": "A long page on khums (a one-fifth religious payment) on surplus income from earnings and gains: how gains are counted, the year, savings, gifts, inheritance, dowry, purchases and business start-up.", "file": "data/records/sistani/sistani-laws-2306.yaml", "cats": ["faith", "ruling"]}, {"id": "sistani-laws-2311", "title": "CHAPTER SIX » The One-Fifth Tax (Khums) » 6. SPOILS OF WAR", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2311/", "authors": [], "marja": "sistani", "note": "Concerns war and relations with non-Muslims; cataloged neutrally by topic.", "desc": "Covers khums on spoils of war, the rules that apply when war is fought with or without authorisation, and the treatment of property taken from combatants.", "file": "data/records/sistani/sistani-laws-2311.yaml", "cats": ["faith"]}, {"id": "sistani-laws-2325", "title": "CHAPTER EIGHT » Alms Tax (Zakat) » CRITERIA FOR BEING ENTITLED (MUSTAḤIQQ) TO RECEIVE ZAKAT", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2325/", "authors": [], "marja": "sistani", "note": "Includes conditions on the recipient's creed (Twelver Shia), a Shia-Sunni matter; flagged for review.", "desc": "Covers the criteria of someone entitled to receive zakat, including their creed, children and minors, relatives, dependants, spouses, sayyids and people unknown to the giver.", "file": "data/records/sistani/sistani-laws-2325.yaml", "cats": ["sunni"]}, {"id": "sistani-laws-2329", "title": "CHAPTER EIGHT » Alms Tax (Zakat) » DISTRIBUTION OF ZAKĀT AL‑FIṬRAH", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2329/", "authors": [], "marja": "sistani", "note": "Includes a condition on the recipient's creed (Shia), a Shia-Sunni matter; flagged for review.", "desc": "Covers who can receive zakat al-fitrah (the alms given at the end of Ramadan), poor children, the kinds and amounts of items given, and giving it to someone mistakenly thought to be poor.", "file": "data/records/sistani/sistani-laws-2329.yaml", "cats": ["sunni"]}, {"id": "sistani-laws-2366", "title": "CHAPTER TWENTY-SEVEN » Marriage » CONDITIONS OF A MARRIAGE CONTRACT", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2366/", "authors": [], "marja": "sistani", "note": "Covers guardianship and consent in marriage, including for girls; flagged for human review.", "desc": "Covers conditions for a marriage contract: the formula, consent, compulsion, and the role of a father or paternal grandfather in the marriage of a girl who has reached adulthood.", "file": "data/records/sistani/sistani-laws-2366.yaml", "cats": ["marriage"]}, {"id": "sistani-laws-2367", "title": "CHAPTER TWENTY-SEVEN » Marriage » SITUATIONS IN WHICH A MAN AND A WOMAN CAN ANNUL THE MARRIAGE CONTRACT", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2367/", "authors": [], "marja": "sistani", "note": "Sensitive family-law matter touching on bodily defects; flagged for review.", "desc": "Covers situations in which a man or a woman can annul (cancel) a marriage contract, such as discovering certain defects or finding that the other was described inaccurately.", "file": "data/records/sistani/sistani-laws-2367.yaml", "cats": ["marriage", "ruling", "sensitive"]}, {"id": "sistani-laws-2368", "title": "CHAPTER TWENTY-SEVEN » Marriage » WOMEN WITH WHOM MARRIAGE IS UNLAWFUL (ḤARĀM)", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2368/", "authors": [], "marja": "sistani", "note": "Covers sexual relationships outside marriage and marriage across faiths; flagged for review.", "desc": "A long page on women with whom marriage is unlawful (haram): relatives, in-laws, relationships created by marriage or by certain acts, restrictions after divorce, and marriage between a Muslim woman and a non-Muslim man.", "file": "data/records/sistani/sistani-laws-2368.yaml", "cats": ["sexual", "marriage"]}, {"id": "sistani-laws-2369", "title": "CHAPTER TWENTY-SEVEN » Marriage » LAWS OF PERMANENT MARRIAGE", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2369/", "authors": [], "marja": "sistani", "note": "Covers marital duties including intimacy and polygamy; flagged for human review.", "desc": "Covers laws of permanent marriage: duties of a wife and husband, living expenses, marital rights, housework, several wives, and terms in the contract.", "file": "data/records/sistani/sistani-laws-2369.yaml", "cats": ["sexual"]}, {"id": "sistani-laws-2370", "title": "CHAPTER TWENTY-SEVEN » Marriage » LAWS OF TEMPORARY MARRIAGE (MUTʿAH)", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2370/", "authors": [], "marja": "sistani", "note": "Temporary marriage is a distinctive Shia-Sunni matter and concerns sexual relations; flagged for review.", "desc": "Covers temporary marriage (mutah): how it differs from permanent marriage, conditions, living expenses, inheritance, leaving the home, and what happens when time remains or the waiting period is not over.", "file": "data/records/sistani/sistani-laws-2370.yaml", "cats": ["sunni", "sexual", "marriage"]}, {"id": "sistani-laws-2371", "title": "CHAPTER TWENTY-SEVEN » Marriage » LOOKING AT NON‑MAḤRAM", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2371/", "authors": [], "marja": "sistani", "note": "Concerns modesty and bodily matters; flagged for human review.", "desc": "Covers looking at non-mahram (people one sistani.org/english/book/26890/8481/", "authors": [], "marja": "sistani", "note": "Describes sexual topics in plain language; reviewer to confirm the wording is suitable.", "desc": "Covers janabah (a state of major ritual impurity linked to sexual activity): the ways it arises and how it is recognised.", "file": "data/records/sistani/sistani-worship-8481.yaml", "cats": ["sexual"]}, {"id": "sistani-worship-8494", "title": "Sixth Purifier: Converting to Islam", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/26890/8494/", "authors": [], "marja": "sistani", "note": "Touches on the status of non-Muslims in matters of ritual purity; reviewer to confirm wording.", "desc": "Covers the sixth purifier, converting to Islam, in relation to a person previously regarded as ritually unclean.", "file": "data/records/sistani/sistani-worship-8494.yaml", "cats": ["faith"]}, {"id": "sistani-worship-8519", "title": "Conditions for Recipients of Zakāt", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/26890/8519/", "authors": [], "marja": "sistani", "note": "The conditions for recipients include matters of religious affiliation and personal conduct (Shia-Sunni and sensitive classification); reviewer to confirm.", "desc": "Covers the conditions for those who receive zakat, such as belief and the use to which it is put.", "file": "data/records/sistani/sistani-worship-8519.yaml", "cats": ["sunni", "sensitive"]}, {"id": "sistani-worship", "title": "Summary of the Rules of Worship", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "work", "url": "https://www.sistani.org/english/book/26890/", "authors": [], "marja": "sistani", "note": "No individual author is named: the Introduction (https://www.sistani.org/english/book/26890/8476/) says the treatise was prepared by the Office of Al-Sayyid Al-Sistani in accordance with his fatwas, so authors is empty. Level set to advanced because the Introduction describes a summary of the most important rulings but does not state an audience or level; reviewer to confirm (intermediate may fit).", "desc": "A concise treatise on the main rulings (fiqh) of worship, prepared by the office of Sayyid Ali al-Sistani in line with his fatwas. It covers prayer, fasting, Hajj, zakat and khums (religious payments), with selected rulings on purity, taqlid (following a jurist) and enjoining good and forbidding evil.", "file": "data/records/sistani/sistani-worship.yaml", "cats": ["level", "ruling", "author"]}, {"id": "thaqalayn-al-khisal", "title": "Al-Khiṣāl: The Book of Characteristics", "source": "thaqalayn.net", "level": "advanced", "tag": "hadith", "gran": "work", "url": "https://thaqalayn.com/book/10", "authors": ["Shaykh Muḥammad b. ʿAlī al-Ṣaduq"], "marja": "", "note": "Mixed content: the site says the narrations cover history, doctrine, ethics and jurisprudence. The main purpose is not legal, so it is cataloged with hadith-collections only; a reviewer should confirm the classification and whether a subject heading should be added.", "desc": "A collection of hadith (reported sayings of the Prophet and the Imams) compiled by Shaykh al-Saduq and arranged by the numbers mentioned in them, from one-numbered characteristics upward; shown in Arabic with an English translation by Dr. Ali Peiravi. According to the site the narrations range over history, doctrine, ethics and jurisprudence. It is a primary source for readers with some background.", "file": "data/records/thaqalayn/thaqalayn-al-khisal.yaml", "cats": ["history", "ruling", "heading"]}, {"id": "thaqalayn-fadail-al-shia", "title": "Faḍaʾil al-Shīʿa: Virtues of the Shia", "source": "thaqalayn.net", "level": "advanced", "tag": "hadith", "gran": "work", "url": "https://thaqalayn.com/book/25", "authors": ["Shaykh Muḥammad b. ʿAlī al-Ṣaduq"], "marja": "", "note": "The site's blurb says the hadith affirm the Shia as 'the only followers' who faithfully follow the Prophet's path; this is a sectarian claim made by the source, not by the catalog. Reviewer should confirm the description and headings.", "desc": "A short collection of 45 selected hadith (reported sayings of the Imams) compiled by Shaykh al-Saduq, shown with an English translation by Badr Shahin. The site says the narrations describe the standing of the Shia community and its place among followers of the Prophet. It is a primary source for readers with some background.", "file": "data/records/thaqalayn/thaqalayn-fadail-al-shia.yaml", "cats": ["heading"]}, {"id": "thaqalayn-kitab-al-duafa", "title": "Kitāb al-Ḍuʿafāʾ: The Weakened Ones", "source": "thaqalayn.net", "level": "advanced", "tag": "book", "gran": "work", "url": "https://thaqalayn.com/book/17", "authors": ["Abū al-Ḥusayn Aḥmad b. al-Ḥusayn al-Ghaḍā'irī"], "marja": "", "note": "The page itself describes this as a rijal (narrator-evaluation) work, so it is typed as a book rather than a hadith collection. The page's title says 'Attributed to Ibn al-Ghada'iri' and its text says scholars have disputed the book's authorship; the author link is kept only because the page names him.", "desc": "A biographical reference on narrators of Shia hadith and their reliability, shown with an English translation by Tashayyu. The site says it is organised alphabetically and is also known as 'Rijal Ibn al-Ghada'iri' (rijal means the study of narrators). It is not a hadith collection; it is a tool for studying who transmitted hadith.", "file": "data/records/thaqalayn/thaqalayn-kitab-al-duafa.yaml", "cats": ["history", "author"]}, {"id": "thaqalayn-kitab-al-ghayba-tusi", "title": "Kitāb al-Ghayba: The Book of Occultation", "source": "thaqalayn.net", "level": "advanced", "tag": "hadith", "gran": "work", "url": "https://thaqalayn.com/book/27", "authors": ["Shaykh Muḥammad b. al-Ḥasan al-Ṭūsī"], "marja": "", "note": "Level set to advanced by default for a primary source. The site lists two different books titled 'Kitāb al-Ghayba' (this one by al-Ṭūsī at /book/27 and one by al-Nuʿmānī at /book/22); the id carries the author's name to keep them apart. The site describes the book as responding to other sects; a reviewer should confirm the headings.", "desc": "A book by Shaykh al-Tusi on the occultation (ghayba, meaning being hidden from view) of the twelfth Imam, al-Mahdi; shown in Arabic with an English translation by Sayyid Athar Husain S. H. Rizvi. According to the site it combines arguments and hadith (reported sayings of the Prophet and the Imams) on the occultation, the Imam's deputies and the signs of his return. It is a detailed primary source for readers with some background.", "file": "data/records/thaqalayn/thaqalayn-kitab-al-ghayba-tusi.yaml", "cats": ["level", "author", "heading"]}, {"id": "thaqalayn-maani-al-akhbar", "title": "Maʿānī al-ʾAkhbār: The Meanings of Reports", "source": "thaqalayn.net", "level": "advanced", "tag": "hadith", "gran": "work", "url": "https://thaqalayn.com/book/28", "authors": ["Shaykh Muḥammad b. ʿAlī al-Ṣaduq"], "marja": "", "note": "Mixed subjects (Quran, law, theology, ethics, history) with no single fitting heading; closest headings used.", "desc": "A collection of 809 hadith (reported sayings of the Prophet and the Imams) compiled by Shaykh al-Saduq, shown with an English translation by Basel Kadem. The site says it explains about 500 terms and concepts from the Quran, hadith, theology and law, and groups its content into Quranic, legal, theological, ethical and historical hadith. It is a primary source for readers with some background.", "file": "data/records/thaqalayn/thaqalayn-maani-al-akhbar.yaml", "cats": ["history", "ruling", "heading"]}, {"id": "thaqalayn-man-la-yahduruh-al-faqih-vol-5-mashaykha", "title": "Man Lā Yaḥḍuruh al-Faqīh (Vol. 5 Mashaykha): He who is without Jurist", "source": "thaqalayn.net", "level": "advanced", "tag": "hadith", "gran": "work", "url": "https://thaqalayn.com/book/38", "authors": ["Shaykh Muḥammad b. ʿAlī al-Ṣaduq"], "marja": "", "note": "Volume's chapter titles are all 'Clarification of the Transmission Chain...'; the page does not state what 'Mashaykha' means, so heading hadith-sciences is a best guess. Reviewer should confirm.", "desc": "Volume 5 of 5 (titled 'Mashaykha' on the site) of Man La Yahduruh al-Faqih, a hadith collection compiled by Shaykh al-Saduq, shown with an English translation by Bab Ul Qaim Publications. Its chapter titles are 'clarifications of the transmission chain' (the line of narrators) for many reports. It is a specialist primary source for readers interested in how hadith were passed down.", "file": "data/records/thaqalayn/thaqalayn-man-la-yahduruh-al-faqih-vol-5-mashaykha.yaml", "cats": ["heading"]}, {"id": "thaqalayn-mujam-al-ahadith-al-mutabara", "title": "Muʿjam al-Aḥādīth al-Muʿtabara: Compilation of Authenticated Narrations", "source": "thaqalayn.net", "level": "advanced", "tag": "hadith", "gran": "work", "url": "https://thaqalayn.com/book/9", "authors": ["Shaykh Muḥammad Āṣif al-Muḥsinī"], "marja": "", "note": "The site titles this 'Compilation of Authenticated Narrations' and describes the compiler's own criteria for reliability; the record only reports this as the site's description and makes no claim about authenticity. Mixed subjects (intellect, jurisprudence principles, narrators, tawhid, Quran); headings are the closest fit.", "desc": "A hadith collection (reported sayings of the Prophet and the Imams) compiled by Shaykh Muhammad Asif al-Muhsini, shown with an English translation by Ammaar Muslim. The site says he gathered narrations he judged reliable, using criteria it describes, and notes that some scholars may differ with his judgments. Chapters cover intellect and knowledge, principles of jurisprudence, narrators, divine unity and the Quran.", "file": "data/records/thaqalayn/thaqalayn-mujam-al-ahadith-al-mutabara.yaml", "cats": ["author", "heading"]}, {"id": "thaqalayn-risalat-al-huquq", "title": "Risālat al-Ḥuqūq: Treatise of Rights", "source": "thaqalayn.net", "level": "advanced", "tag": "hadith", "gran": "work", "url": "https://thaqalayn.com/book/33", "authors": [], "marja": "", "note": "The page says 'attributed to Imam Zayn al-ʿĀbidīn'. authors is left empty because the work is an attributed text of an Imam, not a compiler's book, and the Imam has no entry in scholars.yaml; the owner should decide how Imams are represented in the authority file. Level kept at advanced by the default rule for primary sources, but this short text may suit intermediate readers; reviewer to confirm.", "desc": "A short treatise on the rights a person owes to God, to society, to family and to their own body, which the site presents as attributed to Imam Zayn al-Abidin; shown in Arabic with an English translation by William C. Chittick. It is brief and covers everyday duties toward others.", "file": "data/records/thaqalayn/thaqalayn-risalat-al-huquq.yaml", "cats": ["level", "author"]}], "labels": {"level": "Level not stated or inferred", "sunni": "Shia and Sunni views differ", "history": "Contested history", "faith": "Other faiths or non-Muslims", "sexual": "Sexual or intimate matters", "marriage": "Marriage, family or gender", "ruling": "Might be a rulings work", "polemic": "Possible polemic", "author": "Author or scholar to confirm", "heading": "Subject heading fit", "duplicate": "Duplicate or near-duplicate", "thin": "Thin or uncertain description", "sensitive": "Sensitive topic", "other": "Other"}, "counts": {"level": 9, "sunni": 16, "history": 7, "faith": 87, "sexual": 88, "marriage": 12, "ruling": 11, "polemic": 0, "author": 12, "heading": 10, "duplicate": 1, "thin": 4, "sensitive": 42, "other": 8}, "total": 1729, "built": "2026-11-11"};
const $=s=>document.querySelector(s);
const el=(t,a,...k)=>{const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(n==='text')e.textContent=v;else e.setAttribute(n,v)}for(const c of k.flat())if(c!=null)e.append(c);return e};
$('#intro').textContent=`${D.records.length} of ${D.total} records are flagged for a person to check. Built ${D.built}. Each flag says why; the source page link lets you read the original. Nothing here changes the catalog: send corrections to whoever maintains it.`;
const active=new Set();
for(const [c,l] of Object.entries(D.labels)){ if(!D.counts[c])continue;
  const b=el('button',{class:'chip',type:'button','aria-pressed':'false',text:`${l} (${D.counts[c]})`});
  b.onclick=()=>{active.has(c)?active.delete(c):active.add(c);b.setAttribute('aria-pressed',active.has(c));draw()};
  $('#chips').append(b)}
for(const s of [...new Set(D.records.map(r=>r.source))].sort())$('#src').append(el('option',{text:s}));
function draw(){
 const q=$('#q').value.trim().toLowerCase(),src=$('#src').value,lv=$('#lvl').value,gr=$('#gran').value;
 const out=D.records.filter(r=>(!src||r.source===src)&&(!lv||r.level===lv)&&(!gr||r.gran===gr)
  &&(!active.size||r.cats.some(c=>active.has(c)))
  &&(!q||[r.id,r.title,r.note,r.authors.join(' ')].join(' ').toLowerCase().includes(q)));
 $('#count').textContent=`${out.length} shown`;
 const L=$('#list');L.replaceChildren();
 for(const r of out.slice(0,200)){
  L.append(el('article',null,
   el('h2',{text:r.title}),
   el('div',{class:'meta',text:`${r.source} · ${r.gran} · ${r.tag} · ${r.level}${r.authors.length?' · '+r.authors.join(', '):''}${r.marja?' · rulings of '+r.marja:''}`}),
   el('div',{class:'note',text:r.note||'(no note)'}),
   el('details',null,el('summary',{text:'What the record says'}),el('p',{text:r.desc})),
   el('div',{class:'tags'},r.cats.map(c=>el('span',{text:D.labels[c]}))),
   el('p',{class:'meta'},el('a',{href:r.url,target:'_blank',rel:'noopener noreferrer',text:'Open the source page ↗'}),' · ',el('code',{text:r.file}))));
 }
 if(out.length>200)L.append(el('p',{class:'mut',text:`Showing the first 200 of ${out.length}. Narrow the filters to see the rest.`}));
}
for(const id of ['#q','#src','#lvl','#gran'])$(id).addEventListener('input',draw);
draw();
