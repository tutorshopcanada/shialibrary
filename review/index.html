*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}

d an Overview", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/al-hadith-analysis-and-overview-hashim", "authors": ["A.S. Hashim"], "marja": "", "note": "Level is not stated on the page; intermediate chosen as the cautious option. Compares Sunni and Shia collection of hadith and touches on the early caliphs, a historically contested area; a reviewer should confirm the description stays neutral.", "desc": "An article explaining what hadith is and how reports were collected. It covers forged hadiths, the way Sunni and Shia collections developed, the main Shia sources, and how hadith was passed on.", "file": "data/records/al-islam/al-islam-al-hadith-analysis-overview.yaml", "cats": ["level", "sunni", "history"]}, {"id": "al-islam-ali-and-allegiance", "title": "Ali Ibn Abi Talib and Allegiance", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/ali-ibn-abi-talib-and-allegiance-sayyid-saeed-akhtar-rizvi", "authors": ["Sayyid Sa'eed Akhtar Rizvi"], "marja": "", "note": "Disputed early Islamic history (succession); level not stated. Reviewer should confirm neutral wording.", "desc": "An article on Imam Ali's refusal to pay allegiance after the Prophet's death, with sections for three arguments and a conclusion. The page opens by describing a campaign that began after the Prophet's death.", "file": "data/records/al-islam/al-islam-ali-and-allegiance.yaml", "cats": ["level", "sunni", "history"]}, {"id": "al-islam-allahs-bounty-baqiyatullah", "title": "Allah's Bounty, The Baqiyatullah", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/allahs-bounty-baqiyatullah-syeda-farhat-fatima", "authors": ["Syeda Farhat Fatima"], "marja": "", "note": "The page states no audience, date or tags, so intermediate is the cautious level. The heading imam-mahdi is inferred from the title term 'Baqiyatullah' and was not confirmed from the page summary; a reviewer should confirm the topic and heading.", "desc": "A short paper (about 1,200 words) that says it aims to look at the many bounties, or gifts, of Allah. It has a section called 'The Ways Of Allah' and a conclusion.", "file": "data/records/al-islam/al-islam-allahs-bounty-baqiyatullah.yaml", "cats": ["level", "history", "heading"]}, {"id": "al-islam-and-once-again-abu-dharr", "title": "And Once Again Abu Dharr", "source": "al-islam.org", "level": "beginner", "tag": "book", "gran": "work", "url": "https://al-islam.org/and-once-again-abu-dharr-ali-shariati", "authors": ["Ali Shariati"], "marja": "", "note": "Companions of the Prophet are a topic where Shia and Sunni views differ; a reviewer should confirm neutral wording. Beginner level is inferred from the site calling it a brief biography; no audience is stated. The page lists only part numbers, so the description is limited.", "desc": "A brief biography of Abu Dharr al-Ghifari, a companion of the Prophet Muhammad, as the site describes it. The book is divided into an introduction and six parts. The page gives no further details of its contents.", "file": "data/records/al-islam/al-islam-and-once-again-abu-dharr.yaml", "cats": ["level", "sunni"]}, {"id": "al-islam-another-prayer", "title": "Another Prayer", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/another-prayer", "authors": [], "marja": "", "note": "The page states no author, date or audience and does not say it is for children; intermediate chosen as the cautious level. It is listed on the site's 'Texts For Children' page (kids-corner), so a reviewer may confirm beginner. The page tags itself Salah (Prayers) and Woman; checked that it is a story, not a statement of rulings.", "desc": "A short story of roughly 900 to 1,000 words. The site describes it as depicting the struggles women meet over their prayer after giving birth, and as highlighting the Prophet's love and tolerance for children.", "file": "data/records/al-islam/al-islam-another-prayer.yaml", "cats": ["level", "ruling", "author"]}, {"id": "al-islam-arbaeen-reflecting-upon-imams-stand", "title": "Arba’een: Reflecting Upon the Imam’s Stand", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/arbaeen-reflecting-upon-imams-stand-muhammad-legenhausen", "authors": ["Muhammad Legenhausen"], "marja": "", "note": "Level is not stated on the page; intermediate chosen as the cautious option. The author calls the piece philosophical reflections.", "desc": "A short article of philosophical reflections on the stand taken by Imam Husayn, written in connection with Arba'een, the observance forty days after Ashura. It is continuous text without section headings.", "file": "data/records/al-islam/al-islam-arbaeen-reflecting-upon-imams-stand.yaml", "cats": ["level", "author"]}, {"id": "al-islam-army-of-imam-al-hasan", "title": "The Army Of Imam Al-Hasan Ibn Ali", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/army-imam-al-hasan-ibn-ali-syed-ali-imran", "authors": ["Syed Ali Imran"], "marja": "", "note": "Level is not stated on the page; intermediate chosen as the cautious option. Covers disputed early Islamic history (Imam al-Hasan's era and Mu'awiya); a reviewer should confirm neutral wording.", "desc": "A short article about the makeup of the army of Imam al-Hasan, drawing on Shaykh al-Mufid's Kitab al-Irshad. The page's opening line says he had some of the most troublesome companions.", "file": "data/records/al-islam/al-islam-army-of-imam-al-hasan.yaml", "cats": ["level", "sunni", "history"]}, {"id": "al-islam-ashura-tenth-muharram", "title": "Ashura', the Tenth of Muharram", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/ashura-tenth-muharram-muhammad-rida-hakimi", "authors": ["Muhammad Rida Hakimi"], "marja": "", "note": "The page states no audience; level not stated (intermediate chosen as cautious; long historical analysis), reviewer to confirm. Covers disputed early Islamic history; confirm neutral wording. The page also shows the name Hasan Muhammad Al-Najafi without a stated role.", "desc": "A long article (about 6,000 words) that the site describes as a historical analysis of what led to the tragedy of Karbala. It looks at the events around Ashura, the tenth day of Muharram, when Imam Husayn was killed.", "file": "data/records/al-islam/al-islam-ashura-tenth-muharram.yaml", "cats": ["level", "history"]}, {"id": "al-islam-authenticity-nahjul-balaghah", "title": "The Authenticity of Nahjul Balaghah", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/authenticity-nahjul-balaghah-sayyid-fadhil-milani", "authors": ["Sayyid Fadhil Milani"], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. Addresses a disputed question (authenticity of a text); a reviewer should confirm neutral wording.", "desc": "A short article by Sayyid Fadhil Milani on whether Nahj al-Balagha, the collection of Imam Ali's sermons, letters and sayings, can be traced to him. Its sections cover the authenticity of the book, the source of the doubts raised about it, and the early work Tuhaf al-Uqul.", "file": "data/records/al-islam/al-islam-authenticity-nahjul-balaghah.yaml", "cats": ["level", "history", "thin"]}, {"id": "al-islam-baqir-mufid-irshad", "title": "The Infallibles: Imam Muhammad ibn Ali al Baqir (as)", "source": "al-islam.org", "level": "advanced", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/infallibles-imam-muhammad-ibn-ali-al-baqir-shaykh-al-mufid", "authors": ["Shaykh Muḥammad b. Muḥammad al-Mufīd"], "marja": "", "note": "Page states no audience. Translation of a classical primary source, so marked advanced; confirm level. Excerpt from Kitab al-Irshad; page credits Br. 'Ali Abbas as contributor, no translator stated.", "desc": "An excerpt from the classical book Kitab al-Irshad (The Book of Guidance) by Shaykh al-Mufid about Imam Muhammad al-Baqir, the fifth Imam of the Twelver Shia. It covers his birth, the evidence for his Imamate (leadership after the Prophet), his age, his death and burial place, and an account of his brothers.", "file": "data/records/al-islam/al-islam-baqir-mufid-irshad.yaml", "cats": ["level", "author"]}, {"id": "al-islam-basic-teachings-of-islam", "title": "Basic Teachings Of Islam", "source": "al-islam.org", "level": "intermediate", "tag": "book", "gran": "work", "url": "https://al-islam.org/basic-teachings-islam-sayyid-muhammad-husayni-beheshti", "authors": ["Sayyid Muhammad Husayni Beheshti"], "marja": "", "note": "The page does not say who the book is for, so the more cautious level (intermediate) was chosen; a reviewer may judge it beginner. The edition is given only as '3rd edition 1404 A.H.', so `date` is blank.", "desc": "A book that the site says presents the essential beliefs and practices of Islam within the Shia tradition. Most of it is about God: His oneness, how people can know Him, and His relationship to humans and the universe. It then turns to fate and free will, prophets and revelation, the Quran, and the afterlife.", "file": "data/records/al-islam/al-islam-basic-teachings-of-islam.yaml", "cats": ["level"]}, {"id": "al-islam-brief-history-fourteen-infallibles", "title": "Brief History of Fourteen Infallibles", "source": "al-islam.org", "level": "intermediate", "tag": "book", "gran": "work", "url": "https://al-islam.org/brief-history-fourteen-infallibles", "authors": ["World Organization for Islamic Services (WOFIS)"], "marja": "", "note": "Presents the Shia belief in the Twelve Imams as successors of the Prophet, a claim on which istory (Uthman, Jamal, Siffin, Nahrawan); a reviewer should confirm neutral wording.", "desc": "An article that uses Nahj al-Balagha, the collection of Imam Ali's sermons, letters and sayings, to look at why some people opposed him. It discusses tribal, religious, political and ethical motives and the forms the enmity took, including the battles of Jamal, Siffin and Nahrawan.", "file": "data/records/al-islam/al-islam-causes-enmity-imam-ali-nahj.yaml", "cats": ["level", "history", "thin"]}, {"id": "al-islam-characteristics-rightly-guided-imam-nahj", "title": "The Characteristics Of The Just And Rightly Guided Imam In Nahj Ul-Balagha", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/characteristics-just-and-rightly-guided-imam-nahj-ul-balagha", "authors": [], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. No author stated. Imamate is a doctrinal topic; a reviewer should confirm wording. Its text and section headings appear identical to al-islam-perspective-imamat-nahjul-balaghah (a separate URL); possible duplicate content on the site.", "desc": "An article on Imamate (divinely guided leadership) as it appears in Nahj al-Balagha, starting from a well-known saying of the Prophet about recognising the Imam of one's time. Sections cover two kinds of Imams, the Imam of the Hellfire, the Imam of light and guidance, the Ahl al-Bayt and the chain of guidance.", "file": "data/records/al-islam/al-islam-characteristics-rightly-guided-imam-nahj.yaml", "cats": ["level", "sunni", "author", "heading", "duplicate", "thin"]}, {"id": "al-islam-chastisement-as-explained-by-the-quran", "title": "Chastisement As Explained By The Qur’an", "source": "al-islam.org", "level": "advanced", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/chastisement-explained-quran-sayyid-muhammad-husayn-tabatabai", "authors": ["Sayyid Muhammad Husayn Tabataba'i"], "marja": "", "note": "Excerpt from a scholarly Quran commentary (Al-Mizan), so advanced was chosen; the page states no audience.", "desc": "A short excerpt from the Quran commentary Al-Mizan (vol. 5) on how the Quran speaks about chastisement, or punishment. It opens with the idea that a person who forgets his Lord lives a straitened life.", "file": "data/records/al-islam/al-islam-chastisement-as-explained-by-the-quran.yaml", "cats": ["level", "author"]}, {"id": "al-islam-commentaries-nahjul-balaghah", "title": "The Commentaries on Nahjul Balaghah", "source": "al-islam.org", "level": "advanced", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/commentaries-nahjul-balaghah-sayyid-wahid-akhtar", "authors": ["Sayyid Wahid Akhtar"], "marja": "", "note": "The page states no audience; it is a list-style scholarly overview of commentaries, so advanced was chosen cautiously and a reviewer should confirm. The page gives the author as 'Sayyid Wahid Akhtar' and, in an addendum, 'Syed Waheed Akhtar' (Aligarh Muslim University).", "desc": "A bibliographic overview of selected commentaries on Nahjul Balaghah, the collection of sayings and sermons attributed to Imam Ali, including commentaries in Persian and Urdu translations. The page opens by noting the book has been studied and interpreted since the time of al-Radi, who compiled it.", "file": "data/records/al-islam/al-islam-commentaries-nahjul-balaghah.yaml", "cats": ["level", "author"]}, {"id": "al-islam-concept-freedom-nahjul-balaghah", "title": "The Concept of Freedom in the Nahjul Balaghah", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/concept-freedom-nahjul-balaghah-sayyid-wahid-akhtar", "authors": ["Sayyid Wahid Akhtar"], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. Touches on sensitive social topics (rights of slaves, women); a r rophets-imams-deficiencies.yaml", "cats": ["level", "author"]}, {"id": "al-islam-importance-of-dua-method-supplicating", "title": "Importance Of Dua In Islam And Method Of Supplicating", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/importance-dua-islam-and-method-supplicating-syed-zeeshan-haider-jawadi", "authors": ["Syed Zeeshan Haider Jawadi"], "marja": "", "note": "The page states no audience or level, so intermediate was chosen as the cautious option.", "desc": "An extract (about 2,500 to 3,000 words) from the book Nuqoosh Ismat about dua, which means personal supplication or asking God for help. Its sections cover the method of supplicating, the causes of a supplication being accepted, and why some are not accepted.", "file": "data/records/al-islam/al-islam-importance-of-dua-method-supplicating.yaml", "cats": ["level"]}, {"id": "al-islam-in-praise-imam-zaynul-abideen", "title": "In Praise of Imam Zaynul Abideen (a.s.)", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/praise-imam-zaynul-abideen", "authors": [], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. The poem's composer Farazdaq is named in the text; not added to scholars.yaml and authors left empty since the page names no author of the page itself.", "desc": "A very short page presenting a poem in praise of Imam Zayn al-Abidin, the fourth Imam. The page explains the occasion: during Hajj, the Caliph Hisham ibn Abd al-Malik was overshadowed by the respect people showed the Imam, and the poet Farazdaq then recited an ode.", "file": "data/records/al-islam/al-islam-in-praise-imam-zaynul-abideen.yaml", "cats": ["level", "author", "thin"]}, {"id": "al-islam-in-pursuance-of-the-sun", "title": "In Pursuance Of The Sun", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/pursuance-sun-sayed-jamaluddin-hejazi", "authors": ["Sayed Jamaluddin Hejazi"], "marja": "", "note": "Level is not stated on the page; intermediate chosen as the cautious option. The page filed under /articles/ calls itself a book. A historical narrative that a reviewer should check for neutrality.", "desc": "A narrative account, which the page itself calls a book, of how Lady Narjis travelled to find Imam al-Askari, including her origins and captivity. The page tags it with Imam al-Mahdi. It ends with ten comprehension questions.", "file": "data/records/al-islam/al-islam-in-pursuance-of-the-sun.yaml", "cats": ["level", "history"]}, {"id": "al-islam-in-the-presence-of-the-beloved", "title": "In the Presence of the Beloved", "source": "al-islam.org", "level": "intermediate", "tag": "book", "gran": "work", "url": "https://al-islam.org/presence-beloved-muhammad-taqi-misbah-yazdi", "authors": ["Muhammad Taqi Misbah Yazdi"], "marja": "", "note": "Level is not stated on the page; intermediate chosen as the cautious option.", "desc": "A book of lectures on dua (supplication). The first part introduces supplication, and the rest comment on three well-known supplications, Du'a al-Iftitah, Du'a Abu Hamzah al-Thumali and Du'a Makarim al-Akhlaq.", "file": "data/records/al-islam/al-islam-in-the-presence-of-the-beloved.yaml", "cats": ["level"]}, {"id": "al-islam-indicators-of-piety-part-1", "title": "Indicators of Piety Part 1", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/message-thaqalayn/vol-15-no-1-spring-2014/indicators-piety-part-1-mohammad-ali-shomali", "authors": ["Mohammad Ali Shomali"], "marja": "", "note": "Level not stated; intermediate chosen. Listed on the Spirituality hub. Only the abstract was visible; description limited accordingly.", "desc": "A journal paper, the first of seven lessons given in London in 2011, on the value and results of piety (taqwa) according to the Qur'an, hadith and the lives of the Ahlul Bayt. It also introduces signs by which one can examine one's own piety.", "file": "data/records/al-islam/al-islam-indicators-of-piety-part-1.yaml", "cats": ["level"]}, {"id": "al-islam-indicators-of-piety-part-2", "title": "Indicators of Piety, Part 2", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/message-thaqalayn/vol-15-no-2-summer-2014/indicators-piety-part-2-mohammad-ali-shomali", "authors": ["Mohammad Ali Shomali"], "marja": "", "note": "Level not stated on the page; intermediate chosen. Part 2 of a series; part 1 already cataloged. Published in Message of Thaqalayn vol. 15 no. 2 (2014); date left blank.", "desc": "A journal paper, the second of seven lessons given in London in July 2011, on piety (taqwa, being conscious of God) and signs by which a person can check their own piety. Its sections look at piety in hadith (reported sayings of the Prophet and Imams) and in the Qur'an.", "file": "data/records/al-islam/al-islam-indicators-of-piety-part-2.yaml", "cats": ["level"]}, {"id": "al-islam-infallibles-imam-muhammad-al-taqi", "title": "The Infallibles: Imam Muhammad Al Taqi (as)", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/infallibles-imam-muhammad-al-taqi", "authors": [], "marja": "", "note": "The page names no author (only 'Contributed by' an email address), no date and no audience; intermediate chosen as the cautious level. It is also listed on the site's 'Texts For Children' page, so a reviewer may confirm beginner. Page tags are Biography, Death and Youth.", "desc": "A short biography (about 1,400 words) of Imam Muhammad al-Taqi, the ninth of the Twelve Imams of Shia Islam. Sections cover his parents and birth, childhood, titles, life and works, death and burial, and a summary of his work.", "file": "data/records/al-islam/al-islam-infallibles-imam-muhammad-al-taqi.yaml", "cats": ["level", "author"]}, {"id": "al-islam-infallibles-musa-al-kazim-mufid", "title": "The Infallibles: Imam al Musa al Kazim (A.S)", "source": "al-islam.org", "level": "advanced", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/infallibles-imam-al-musa-al-kazim-shaykh-al-mufid", "authors": ["Shaykh Muḥammad b. Muḥammad al-Mufīd"], "marja": "", "note": "The page states no audience or level; advanced chosen because it is a long classical biography (roughly 7,000-8,000 words). Author id mufid was created from a thaqalayn entry; confirm it is the same al-Mufid. The sections on his imamate designation and death touch on sensitive history.", "desc": "A classical biographical account of Imam Musa al-Kazim, the seventh of the Twelve Imams, by the scholar al-Mufid. Its sections cover how his father named him as the next Imam, reported signs and miracles, his virtues, and the reported reasons and accounts of his killing. It is a long, detailed text.", "file": "data/records/al-islam/al-islam-infallibles-musa-al-kazim-mufid.yaml", "cats": ["level", "sunni", "history", "author", "sensitive"]}, {"id": "al-islam-intention-as-the-spirit-of-prayer", "title": "Intention as the Spirit of Prayer", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/intention-spirit-prayer-mohammad-ali-shomali", "authors": ["Mohammad Ali Shomali"], "marja": "", "note": "Borderline check: the page's content is spiritual and ethical reflection on intention, not a statement of rulings (though it touches on prayer validity), so treated as non-fiqh; a reviewer should confirm. Level not stated; intermediate chosen. Published in Spiritual Quest vol. 1 no. 2 (2011).", "desc": "An article on the role of intention (the inner purpose and awareness behind an act) in prayer and in good deeds generally. Its sections cover unrealised good intentions, keeping good intention after an act, and awareness.", "file": "data/records/al-islam/al-islam-intention-as-the-spirit-of-prayer.yaml", "cats": ["level", "ruling"]}, {"id": "al-islam-introduction-islam-beatty", "title": "Introduction to Islam", "source": "al-islam.org", "level": "beginner", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/introduction-islam-diana-masooma-beatty", "authors": ["Diana Masooma Beatty"], "marja": "", "note": "Level set to beginner because the title is 'Introduction to Islam' and the piece is short and general; the page itself does not state an audience level, so a reviewer should confirm. The page names the author as 'Diana Masooma Beatty' and in the byline 'Masooma Beatty'.", "desc": "A short article (about 500 words) that presents Islam as the same religion God revealed to all peoples through His messengers. It also gives advice for people in the West on getting along with Muslim neighbours, students, employees and coworkers.", "file": "data/records/al-islam/al-islam-introduction-islam-beatty.yaml", "cats": ["level", "author"]}, {"id": "al-islam-introduction-science-tafsir", "title": "Introduction To The Science Of Tafsir Of The Qur'an", "source": "al-islam.org", "level": "intermediate", "tag": "book", "gran": "work", "url": "https://al-islam.org/introduction-science-tafsir-quran-jafar-subhani", "authors": ["Ja'far Subhani"], "marja": "", "note": "The page does not state an intended audience or level; intermediate chosen as the cautious option because it discusses the methodology of interpretation.", "desc": "A book about the rules and approach to be used when interpreting the Quran (tafsir means Quran commentary). Its parts cover topics such as Arabic grammar, word meanings, the occasions when verses were revealed, and understanding the history and setting of the revelation. The site describes it as a discussion of the rules governing interpretation of the Quran.", "file": "data/records/al-islam/al-islam-introduction-science-tafsir.yaml", "cats": ["level"]}, {"id": "al-islam-is-god-a-person", "title": "Is God A Person?", "source": "al-islam.org", "level": "advanced", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/god-person-muhammad-legenhausen", "authors": ["Muhammad Legenhausen"], "marja": "", "note": "The page states no audience; advanced chosen cautiously for a philosophical essay. Compares Christian and Muslim theology, so a reviewer should confirm neutral wording.", "desc": "A long essay (about 6,000 words) that sets out arguments for and against the claim that God is a person. The author says he hopes it will support Christian-Muslim dialogue, and the page contrasts Christian and Muslim ways of speaking about God.", "file": "data/records/al-islam/al-islam-is-god-a-person.yaml", "cats": ["level", "faith"]}, {"id": "al-islam-islamic-teachings-in-brief", "title": "Islamic Teachings in Brief", "source": "al-islam.org", "level": "beginner", "tag": "book", "gran": "work", "url": "https://al-islam.org/islamic-teachings-brief-sayyid-muhammad-husayn-tabatabai", "authors": ["Sayyid Muhammad Husayn Tabataba'i"], "marja": "", "note": "The Imamate chapter covers a belief on which Shia and Sunni Muslims differ. The level is taken from the page's description of a summary in relatively simple language.", "desc": "A short book by Sayyid Muhammad Husayn Tabataba'i that the site describes as a summary of the teachings of Islam, written in relatively simple language. It covers belief in God, prophethood, the Qur'an, the Prophet and his family, the Imamate (the belief in leaders after the Prophet), the afterlife, ethics and religious commandments.", "file": "data/records/al-islam/al-islam-islamic-teachings-in-brief.yaml", "cats": ["level", "sunni"]}, {"id": "al-islam-journey-of-imam-husayn", "title": "The Journey of Imam Husayn", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/journey-imam-husayn-shaykh-al-mufid", "authors": ["Shaykh Muḥammad b. Muḥammad al-Mufīd"], "marja": "", "note": "Listed on the Texts for Children and Texts for Youth hubs, but it is a long excerpt of a classical source (about 22 book pages), so beginner was not applied; level stated nowhere, intermediate chosen. Historical account of a contested period; reviewer should confirm.", "desc": "Excerpts from Kitab al-Irshad (pages 305-326) describing Imam Husayn's journey from Mecca to Iraq. It is a long source-text excerpt, translated by I.K.A. Howard, with the text divided into parts.", "file": "data/records/al-islam/al-islam-journey-of-imam-husayn.yaml", "cats": ["level", "history"]}, {"id": "al-islam-justice-as-virtue-of-the-soul", "title": "Justice as a Virtue of the Soul", "source": "al-islam.org", "level": "advanced", "tag": "article", "gran": "work", "url": "https://al-islam.org/message-thaqalayn/vol-12-no-2-summer-2011/justice-virtue-soul-marzieh-sadeqi", "authors": ["Marzieh Sadeqi"], "marja": "", "note": "Level not stated; advanced chosen because it is philosophical and compares philosophers' views. Listed on the Spirituality hub. Only the abstract and outline were visible when read.", "desc": "A journal article on justice understood as a virtue of the soul and a supreme virtue in ethics. According to its section headings it compares Plato's and Aristotle's views with those of Muslim philosophers.", "file": "data/records/al-islam/al-islam-justice-as-virtue-of-the-soul.yaml", "cats": ["level"]}, {"id": "al-islam-karbala-chain-of-events", "title": "Karbala, the Chain of Events", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/karbala-chain-events", "authors": ["Ramzan Sabir"], "marja": "", "note": "Covers disputed early Islamic history (Mu'awiya, Jamal, Siffin); a reviewer should confirm the description stays neutral. Level not stated on the page; intermediate chosen as the cautious option, though it reads as an overview.", "desc": "An article that walks through the events leading to the battle of Karbala and the day of Ashura, when Imam Husayn, the Prophet's grandson, was killed. It gives background on the rulers Mu'awiya and Yazid, follows Imam Husayn's journey to Karbala and the battle itself, and ends with lessons drawn from it and a glossary.", "file": "data/records/al-islam/al-islam-karbala-chain-of-events.yaml", "cats": ["level", "sunni", "history"]}, {"id": "al-islam-khadijah-daughter-of-khuwaylid", "title": "Khadijah, Daughter of Khuwaylid, Wife of Prophet Muhammad", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/khadijah-daughter-khuwaylid-wife-prophet-muhammad-yasin-t-al-jibouri", "authors": ["Yasin T. Al-Jibouri"], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. No section headings, so the description rests on the opening and closing notes. Page states the paper was written 12 May 1994; that is not a clear publication year, so date left blank.", "desc": "A biographical article about Khadijah, the first wife of the Prophet Muhammad. The author's closing note says it was written in 1994 and is meant for those who appreciate history, whether Muslim or non-Muslim.", "file": "data/records/al-islam/al-islam-khadijah-daughter-of-khuwaylid.yaml", "cats": ["level", "heading", "thin"]}, {"id": "al-islam-lady-khadija-perfect-woman", "title": "Lady Khadija (s.a.): The Perfect Woman", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/lady-khadija-sa-perfect-woman", "authors": [], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. Only about 300 words with no headings, so the description is based on its opening only; no author stated.", "desc": "A very short piece about Lady Khadija, the first wife of the Prophet Muhammad. It opens by naming four women the text holds up as exemplary: Asiya, Mary, Khadija and Fatima.", "file": "data/records/al-islam/al-islam-lady-khadija-perfect-woman.yaml", "cats": ["level", "author", "heading", "thin"]}, {"id": "al-islam-lady-mary-role-model-quran-bible", "title": "Lady Mary as a Role Model in the Qur'an and Bible", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/message-thaqalayn/vol-12-no-2-summer-2011/lady-mary-role-model-quran-and-bible-zahra-kashaniha", "authors": ["Zahra Kashaniha"], "marja": "", "note": "Listed on the Islam and Christianity hub. Level not stated; intermediate chosen. Compares Islamic and Christian accounts; reviewer should confirm neutral wording.", "desc": "A journal article about Mary (Maryam) as a role model, comparing how she is described in the Qur'an and the Gospel. Sections cover her status in Islam, her upbringing and extraordinary events, and why the two sources differ.", "file": "data/records/al-islam/al-islam-lady-mary-role-model-quran-bible.yaml", "cats": ["level", "faith"]}, {"id": "al-islam-lady-zaynab", "title": "Lady Zaynab", "source": "al-islam.org", "level": "intermediate", "tag": "book", "gran": "work", "url": "https://al-islam.org/lady-zaynab-badr-shahin", "authors": ["Badr Shahin"], "marja": "", "note": "Level and audience are not stated on the page. Covers disputed early Islamic history (caliphs' reigns, Mu'awiyah); a reviewer should confirm the description stays neutral. Publication year 2002 is the first edition year on the page (the page also lists 1423 and 1381).", "desc": "A book about the life and character of Lady Zaynab, a daughter of Imam Ali and a member of the Prophet's family (the Ahl al-Bayt). It follows her life through the periods of the caliphs, Imam Ali, Imam al-Hasan and Mu'awiyah, then Karbala, Ashura and her captivity afterwards. The site says it sheds light on her personality.", "file": "data/records/al-islam/al-islam-lady-zaynab.yaml", "cats": ["level", "sunni", "history"]}, {"id": "al-islam-last-days-of-imam-husayn", "title": "Brief account of the last days of Imam Husayn", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/brief-account-last-days-imam-husayn", "authors": [], "marja": "", "note": "No author on the page. Level not stated; intermediate chosen (about 5,000-6,000 words). Contains sectarian honorific markings from the source; reviewer should confirm neutral wording.", "desc": "A day-by-day account from the arrival of Imam Husayn at Karbala on 2nd Muharram to the morning and last sermon of Ashura. Its sections cover letters between commanders, the denial of water, and the eve of Ashura.", "file": "data/records/al-islam/al-islam-last-days-of-imam-husayn.yaml", "cats": ["level", "author"]}, {"id": "al-islam-lets-learn-about-imamate", "title": "Let's Learn About Imamate", "source": "al-islam.org", "level": "beginner", "tag": "book", "gran": "work", "url": "https://al-islam.org/lets-learn-about-imamate-naser-makarem-shirazi", "authors": ["Naser Makarem Shirazi"], "marja": "", "note": "Covers succession to the Prophet and the Ghadir tradition, topics disputed between Shia and Sunni; a reviewer should confirm neutral wording. Beginner level is inferred from the page calling the series a preliminary to further study and from its short lessons with review questions; the page does not state an audience outright.", "desc": "A short lesson-style book on imamate, the Shia belief in divinely appointed leaders after the Prophet. Its ten lessons cover what an Imam is and why one is needed, the Imams' qualities, evidence the author draws from the Quran and sayings of the Prophet, the Twelve Imams and the Twelfth Imam, the Mahdi. Each lesson ends with questions to think about.", "file": "data/records/al-islam/al-islam-lets-learn-about-imamate.yaml", "cats": ["level", "sunni", "history"]}, {"id": "al-islam-letter-father-to-son-last-will", "title": "A Letter from Father to Son, The Last Will of Ali ibn Abi Talib (a)", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/letter-father-son-last-will-ali-ibn-abi-talib", "authors": [], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. Author field left empty: the page names Imam Ali only through a person link. Translator not stated.", "desc": "A letter of advice that, according to the page, Imam Ali gave to one of his sons after returning from the Battle of Siffin. The text is a continuous letter addressed to a young son and is tagged on the site as a 'wasiyya', a last will or counsel.", "file": "data/records/al-islam/al-islam-letter-father-to-son-last-will.yaml", "cats": ["level", "author", "thin"]}, {"id": "al-islam-life-commander-faithful-mufid", "title": "The Life of the Commander of the Faithful Ali Ibn Abu Talib (as)", "source": "al-islam.org", "level": "advanced", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/life-commander-faithful-ali-ibn-abu-talib", "authors": ["Shaykh Muḥammad b. Muḥammad al-Mufīd"], "marja": "", "note": "Page states no audience. Classical primary source, marked advanced; confirm. Contains claims on Imam Ali's merits and succession, which are disputed topics. Translator credited on page: I.K.A Howard.", "desc": "An excerpt from Kitab al-Irshad (The Book of Guidance), a classical work credited on the page to Shaykh al-Mufid, giving an account of Imam Ali, the first Imam of the Twelver Shia. Its two sections are titled 'Imam Ali (as) First in many Fields' and 'Imam Ali and the Ancient Prophets'.", "file": "data/records/al-islam/al-islam-life-commander-faithful-mufid.yaml", "cats": ["level", "sunni", "history", "author"]}, {"id": "al-islam-life-imam-jafar-al-sadiq", "title": "The Life of Imam Ja’far Al-Sadiq", "source": "al-islam.org", "level": "intermediate", "tag": "book", "gran": "work", "url": "https://al-islam.org/life-imam-jafar-al-sadiq-baqir-shareef-al-qurashi", "authors": ["Baqir Sharif al-Qurashi"], "marja": "", "note": "The page does not state an intended audience or level; intermediate chosen as the cautious option for a long, detailed book. Only the first part of the long page (contents list) was read.", "desc": "A biography of Imam Ja'far al-Sadiq, the sixth of the Twelve Imams (the Prophet's descendants whom Shias follow as leaders). The site says it summarises his life. Chapters cover his upbringing, his scientific teaching circle, his debates, letters and advice, his views on politics and economics, and the era he lived in.", "file": "data/records/al-islam/al-islam-life-imam-jafar-al-sadiq.yaml", "cats": ["level"]}, {"id": "al-islam-living-miracle", "title": "The Living Miracle", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/living-miracle-yusuf-fadhl", "authors": ["Yusuf Fadhl"], "marja": "", "note": "Level is not stated on the page; intermediate chosen as the cautious option. The page calls itself a booklet; its foreword is signed by the World Organization for Islamic Services and dated 1 Muharram 1400 AH, but the first publication year is not stated.", "desc": "A booklet about the Quran as a lasting miracle. After a foreword and introduction asking what a miracle is, it looks at the Quran's language, science, history, system of life, prophecies, logic and consistency. The foreword says it is written for English readers.", "file": "data/records/al-islam/al-islam-living-miracle.yaml", "cats": ["level"]}, {"id": "al-islam-love-for-ahlul-bayt-outcomes", "title": "Love for the Ahlul Bayt and its Outcomes", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/message-thaqalayn/vol-14-no-3-autumn-2013/love-ahlul-bayt-and-its-outcomes-husayn-ansariyan", "authors": ["Husayn Ansariyan"], "marja": "", "note": "Level not stated; intermediate chosen. Listed on the Spirituality hub. Mentions tabarri, which can touch sensitive Shia-Sunni matters; reviewer should confirm neutral wording.", "desc": "A journal article, summarised and translated by Mohammad Javad Shomali from a Persian book, on the effects of loving the Ahlul Bayt in this world and the next. It covers hadiths on love for them and effects such as following their instructions, tawalli and tabarri (loyalty and disassociation).", "file": "data/records/al-islam/al-islam-love-for-ahlul-bayt-outcomes.yaml", "cats": ["level", "sunni", "sensitive"]}, {"id": "al-islam-meaning-origins-shiism", "title": "Meaning and Origins of Shiism", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/meaning-and-origins-shiism-sayyid-saeed-akhtar-rizvi", "authors": ["Sayyid Sa'eed Akhtar Rizvi"], "marja": "", "note": "Sensitive topic (origins of Shi'ism and relation to other Muslims). Listed on the Debates & Discussions, Responses to Misconceptions and Further Research hubs; level not stated, intermediate chosen. A reviewer should confirm neutral wording.", "desc": "An article that explains what the word Shi'a means, where Shi'ism began, how the name arose and who the first Shi'as were. The page describes it as a brief but complete piece of research on Shi'ism.", "file": "data/records/al-islam/al-islam-meaning-origins-shiism.yaml", "cats": ["level", "sensitive"]}, {"id": "al-islam-misconceptions-nahjul-balaghah", "title": "Misconceptions about Nahjul Balaghah", "source": "al-islam.org", "level": "advanced", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/misconceptions-about-nahjul-balaghah-sayyid-wahid-akhtar", "authors": ["Sayyid Wahid Akhtar"], "marja": "", "note": "Disputed topic (authenticity of Nahjul Balaghah, with Sunni and Shia scholars mentioned); a reviewer should confirm neutral wording. ut 4,000 words on the history of mourning Imam Husayn. Its sections describe mourning gatherings, called rites, in the house of the Prophet, in the home of one of his wives, among the Companions and at Karbala, according to the author.", "file": "data/records/al-islam/al-islam-our-husayn-mourning-karbala.yaml", "cats": ["level", "history", "author", "sensitive"]}, {"id": "al-islam-path-salvation-peace-ethics-manners", "title": "The Path Of Salvation To Attain Peace Through Our Ethics And Manners", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/path-salvation-attain-peace-through-our-ethics-and-manners", "authors": ["Syeda Farhat Fatima"], "marja": "", "note": "The page states no audience, so intermediate was chosen as the cautious level. The byline lists 'Dr. Farhat Fatima' and also 'Dr. S. Farhana Fatima Abedi'; only the first is recorded as author, so a reviewer should confirm whether the second should be added.", "desc": "An article of about 2,500 to 3,000 words with an abstract. The page says it shows that people can find peace by following the Quran, and it looks at peace as a way of life and at the ethics and manners taught by the Ahl al-Bayt, the Prophet's family.", "file": "data/records/al-islam/al-islam-path-salvation-peace-ethics-manners.yaml", "cats": ["level", "author"]}, {"id": "al-islam-perspective-imamat-nahjul-balaghah", "title": "A Perspective of Imamat in Nahjul Balaghah", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/perspective-imamat-nahjul-balaghah", "authors": [], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. No author stated. Doctrinal topic with Shia-Sunni framing; a reviewer should confirm wording. Section headings match al-islam-characteristics-rightly-guided-imam-nahj; possible duplicate content under two URLs.", "desc": "An article on Imamate (divinely guided leadership) in Nahj al-Balagha, opening with a saying of the Prophet, which the page says both Shia and Sunni traditionists recorded, about knowing the Imam of one's time. Sections cover two kinds of Imams, the Imam of light and guidance, the Ahl al-Bayt and the chain of guidance.", "file": "data/records/al-islam/al-islam-perspective-imamat-nahjul-balaghah.yaml", "cats": ["level", "sunni", "author", "heading", "duplicate", "thin"]}, {"id": "al-islam-philosophy-husayn-sacrifice-azadari", "title": "The Philosophy of Husayn’s Sacrifice & Our Azadari", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/philosophy-husayns-sacrifice-our-azadari-sayyid-muhammad-rizvi", "authors": ["Sayyid Muhammad Rizvi"], "marja": "", "note": "The page states no audience or level; intermediate chosen as the cautious option. Date 1992 is the original publication in The Right Path magazine (Vol. 1, No. 1) as stated on the page.", "desc": "A short article, first published in a 1992 community magazine, on why Imam Husayn gave his life at Karbala and what the purpose of mourning (azadari) for him is. Its sections ask whether the sacrifice was for the intercession of the Shias, why Husayn sacrificed, and the purpose of azadari.", "file": "data/records/al-islam/al-islam-philosophy-husayn-sacrifice-azadari.yaml", "cats": ["level"]}, {"id": "al-islam-plea-islamic-unity", "title": "A Plea For Islamic Unity", "source": "al-islam.org", "level": "beginner", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/plea-islamic-unity-yasser-madani", "authors": ["Sayyid Yasser al-Madani"], "marja": "", "note": "Level set to beginner because the page itself calls it a 'brief article'; the reviewer should confirm. Neutral Shia-Sunni unity piece, flagged as sensitive.", "desc": "A brief article arguing that the Muslim community is currently far from unity. Its sections define Islamic unity, ask whether difference causes disunity, and discuss socio-political unity, dialogue and conclusions.", "file": "data/records/al-islam/al-islam-plea-islamic-unity.yaml", "cats": ["level", "sunni", "sensitive"]}, {"id": "al-islam-preface-nahjul-balaghah", "title": "Preface of Nahjul Balaghah", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/preface-nahjul-balaghah-sayyid-ali-naqi-naqvi", "authors": ["Sayyid Ali Naqi Naqvi"], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. Page has no section headings or description, so the description is based on the opening text only; a reviewer should verify the content.", "desc": "The preface to an edition of Nahj al-Balagha, which the text calls a collection of the utterances of Imam Ali ibn Abi Talib. It is organised as numbered points, with the author discussing the book and its reception.", "file": "data/records/al-islam/al-islam-preface-nahjul-balaghah.yaml", "cats": ["level", "heading", "thin"]}, {"id": "al-islam-prophet-muhammad-divine-mercy", "title": "Prophet Muhammad (S), a Divine Mercy for the Worlds", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/prophet-muhammad-s-divine-mercy-worlds-mansour-leghaei", "authors": ["Mansour Leghaei"], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. Page has a 'Youth' tag but states no audience; content uses specialised theological terms (stages of descent), so beginner not assigned. Contains theological claims a reviewer should confirm.", "desc": "An article about the rank of Prophet Muhammad among the prophets, covering his unique characteristics, the 'world of particles' and the stages of his appointment. The site tags it 'History of the Prophets', 'Biography' and 'Youth'.", "file": "data/ g-children-tahera-kassamali", "authors": ["Tahera Kassamali"], "marja": "", "note": "The page does not state an intended audience or level; intermediate chosen as the cautious option.", "desc": "A book of ten short lessons on the Islamic way of raising children, which the site says draw on Islamic sources originally written in Farsi. Lessons cover the mother's role, religious training, a child's need for love, self-esteem, discipline, play, outside influences, sibling rivalry and common mistakes parents make. It ends with a dua for virtuous children.", "file": "data/records/al-islam/al-islam-raising-children.yaml", "cats": ["level"]}, {"id": "al-islam-religion-human-rights-hocking", "title": "Religion And Human Rights In The Thought Of W.E. Hocking", "source": "al-islam.org", "level": "advanced", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/religion-and-human-rights-thought-we-hocking-muhammad-legenhausen", "authors": ["Muhammad Legenhausen"], "marja": "", "note": "The page states no audience; advanced chosen because it is an academic conference paper with references. The vocabulary has no heading for human rights or philosophy of religion, so ethics is only the closest fit. The page says the paper first appeared in a 2007 volume from Mofid University; the article's own date is left blank.", "desc": "A scholarly paper (about 8,000 to 9,000 words, with an abstract and references) reviewing the ideas of W. E. Hocking, an American philosopher of religion, on the foundations of human rights. The page says it also covers religion in modern society and human rights in Muslim societies.", "file": "data/records/al-islam/al-islam-religion-human-rights-hocking.yaml", "cats": ["level", "heading"]}, {"id": "al-islam-repentance-cradle-of-mercy", "title": "Repentance: The Cradle of Mercy", "source": "al-islam.org", "level": "intermediate", "tag": "book", "gran": "work", "url": "https://al-islam.org/repentance-cradle-mercy-husayn-ansariyan", "authors": [ ponses to Misconceptions hub. Shia-Sunni unity piece; flagged as sensitive.", "desc": "The first part of a series of articles, reprinted from the journal Al-Taqrib (2010), about the stance of the Shia Imams on Muslim unity. It covers the meaning of Islamic unity, what the Qur'an says about unity and division, and the Prophet's example.", "file": "data/records/al-islam/al-islam-shia-imams-muslim-unity-part-1.yaml", "cats": ["level", "sunni", "sensitive"]}, {"id": "al-islam-shia-imams-muslim-unity-part-2", "title": "The Shia Imams and Muslim Unity Part 2", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/al-taqrib/number-7-november-2010/shia-imams-and-muslim-unity-part-2-ali-aqa-nuri", "authors": ["Ali Aqa-Nuri"], "marja": "", "note": "Level not stated; intermediate chosen. Discusses groups within and outside Shia Islam and early disputes; flagged as sensitive. Page also names Hamid Hussein Waqar without a stated role; not added to the authority file.", "desc": "The second part of a series from the journal Al-Taqrib (2010) on the Shia Imams and Muslim unity. It looks at the problems the Imams faced in their lifetimes, such as political pressure, extremism, forged traditions and opposing groups.", "file": "data/records/al-islam/al-islam-shia-imams-muslim-unity-part-2.yaml", "cats": ["level", "author", "thin", "sensitive"]}, {"id": "al-islam-sources-nahjul-balaghah", "title": "Sources of Nahjul Balaghah", "source": "al-islam.org", "level": "advanced", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/sources-nahjul-balaghah-sayyid-wahid-akhtar", "authors": ["Sayyid Wahid Akhtar"], "marja": "", "note": "Touches on the disputed question of the book's sources; a reviewer should confirm neutral wording. The page states no audience; advanced chosen cautiously as a heavily referenced scholarly piece adapted from a book on early Imamiyah thinkers. Author appears as 'Sayyid Wahid Akhtar' and al-islam/al-islam-spiritual-migration.yaml", "cats": ["level", "ruling"]}, {"id": "al-islam-stories-of-the-prophets", "title": "Stories of The Prophets", "source": "al-islam.org", "level": "beginner", "tag": "book", "gran": "work", "url": "https://al-islam.org/stories-prophets", "authors": ["Tawhid Institute"], "marja": "", "note": "The page does not state an audience; beginner level is inferred from the site's description as simple English accounts and from its illustrated, story format. Author is an organisation (Tawhid Institute); the page also names an editor and an illustrator, which the schema has no field for.", "desc": "An illustrated collection of short, simply written accounts of the lives of earlier prophets, as the site describes it. Chapters cover Adam, Habil and Qabil (Abel and Cain), Nuh (Noah), Hud, Salih, Ibrahim (Abraham), Ismail, Yaqub, Yusuf (Joseph), Shu'ayb, Yunus (Jonah), Ayyub (Job) and Musa (Moses).", "file": "data/records/al-islam/al-islam-stories-of-the-prophets.yaml", "cats": ["level", "author"]}, {"id": "al-islam-sun-behind-the-clouds", "title": "The Sun Behind the Clouds", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/sun-behind-clouds-muhammad-baqir-majlisi", "authors": ["Muhammad Baqir al-Majlisi"], "marja": "", "note": "Level is not stated on the page; intermediate chosen as the cautious option. Commentary on narrations from Bihar al-Anwar; a reviewer may judge it more advanced.", "desc": "A short article, translated by Afzal Sumar, with al-Majlisi's commentary on narrations that compare Imam al-Mahdi during the occultation to the sun behind clouds. The site describes it as one of the common narrations conveying his role while hidden.", "file": "data/records/al-islam/al-islam-sun-behind-the-clouds.yaml", "cats": ["level"]}, {"id": "al-islam-the-ahlul-bayt-abid-ali", "title": "The Ahlul Bayt", "source": "al-islam.org", "level": "beginner", "tag": "article", " r should confirm level.", "desc": "A very short story (roughly 350-400 words), an excerpt from the book When Faith Reigns, that begins with a stranger and traveller arriving at a door. The site tags it Mother, Salah (Prayers) and Young Muslim.", "file": "data/records/al-islam/al-islam-the-prayer-of-a-mother.yaml", "cats": ["level", "ruling", "heading"]}, {"id": "al-islam-understanding-gods-mercy-part-2", "title": "Understanding God's Mercy Part 2", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/message-thaqalayn/vol-12-no-1-spring-2010/understanding-god-s-mercy-2-shomali", "authors": ["Mohammad Ali Shomali"], "marja": "", "note": "Level not stated; intermediate chosen. Listed on the Introducing Islam hub.", "desc": "A journal paper, part 2 of 8, on God's mercy and His purpose in creating humans, drawing on the Qur'an, divine sayings and the prayers and hadiths of the Ahl al-Bayt. Sections cover God's names such as al-Rahman and al-Rahim.", "file": "data/records/al-islam/al-islam-understanding-gods-mercy-part-2.yaml", "cats": ["level"]}, {"id": "al-islam-uprising-of-ashura-responses-to-doubts", "title": "The Uprising of Ashura and Responses to Doubts", "source": "al-islam.org", "level": "advanced", "tag": "book", "gran": "work", "url": "https://al-islam.org/uprising-ashura-and-responses-doubts-ali-asghar-ridwani", "authors": ["Ali Asghar Ridwani"], "marja": "", "note": "The page calls it a detailed account, so advanced was chosen; the level is not otherwise stated. Covers mourning practices and answers doubts about Karbala, a sensitive topic; a reviewer should confirm the description stays neutral.", "desc": "A detailed book on Imam Husayn's life and character and the tragedy of Karbala, according to the site. It also covers Shia mourning practices such as crying and reciting elegies, and answers questions about the uprising, such as who killed Imam Husayn.", "file": "data/records/al-islam/al-islam-uprising-of-ashura-responses-to-doubts.yaml", "cats": ["level", "sensitive"]}, {"id": "al-islam-various-sayings-imam-ali", "title": "Various Sayings of Imam Ali Ibn Abi Talib (as)", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/various-sayings-imam-ali-ibn-abi-talib", "authors": [], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. Page carries a 'Youth' tag but states no audience. No single author stated (several contributors/translators credited). I read only the first 100000 characters of the page.", "desc": "A compilation of sayings of Imam Ali, with extracts from Du'a Kumayl and from Nahj al-Balagha. Topics include knowledge, intellect, faith, the heart and the illusion of this world, and it includes two sermons written without dots and without the letter alif. The site tags it 'Youth' and 'Short Sayings'.", "file": "data/records/al-islam/al-islam-various-sayings-imam-ali.yaml", "cats": ["level", "author", "thin"]}, {"id": "al-islam-was-muhammad-prophet-of-terror", "title": "Was Muhammad (S) a Prophet of Terror?!", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/was-muhammad-s-prophet-terror-mansour-leghaei", "authors": ["Mansour Leghaei"], "marja": "", "note": "Listed on the Introducing Islam hub. Level not stated; intermediate chosen (about 4,000 words). Responds to a sensitive accusation about the Prophet and discusses violent historical events; reviewer should confirm neutral wording.", "desc": "An article that examines certain historical reports about killings in the time of the Prophet, answering the question in its title. Its sections give examples, analyse the reports and discuss who the real victims of terrorism are.", "file": "data/records/al-islam/al-islam-was-muhammad-prophet-of-terror.yaml", "cats": ["level", "history", "sensitive"]}, {"id": "al-islam-what-does-it-mean-to-be-muslim", "title": "What Does It Mean To Be A Muslim?", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/what-does-it-mean-be-muslim-muhammad-legenhausen", "authors": ["Muhammad Legenhausen"], "marja": "", "note": "The page states no audience or level, so intermediate was chosen as the cautious option. The first point concerns the legal (jurisprudential) definition of a Muslim, but the article's main purpose is a general reflection on identity, not stating rulings; a reviewer may confirm. Page tag is Ethics.", "desc": "A short article (about 850 to 900 words) that looks at what being a Muslim means. It sets out four points, covering the legal definition of a Muslim, belonging to the Muslim community, holding the values and doctrines taught in Islam, and behaving in line with them.", "file": "data/records/al-islam/al-islam-what-does-it-mean-to-be-muslim.yaml", "cats": ["level", "ruling"]}, {"id": "al-islam-what-is-ashoora", "title": "What is 'Ashoora?", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/what-ashoora-ahmed-ali-khan", "authors": ["Ahmed Ali Khan"], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. Covers disputed early Islamic history (the events leading to Karbala); a reviewer should confirm neutral wording. Only section titles were available to describe the content.", "desc": "A short article about Ashura, the tenth day of Muharram, when Shias remember the killing of Imam Husayn at Karbala. Its two sections ask what led to the events of Karbala and what the purpose of Imam Husayn's sacrifice was.", "file": "data/records/al-islam/al-islam-what-is-ashoora.yaml", "cats": ["level", "history", "thin"]}, {"id": "al-islam-what-non-muslims-say-about-ali", "title": "Personalities: What Non-Muslims Say About 'Ali, The First Successor of Prophet Muhammad", "source": "al-islam.org", "level": "intermediate", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/personalities-what-non-muslims-say-about-ali-first-successor-prophet-muhammad", "authors": [], "marja": "", "note": "The page states no description, audience or level; intermediate chosen as the cautious option. Tagged on the site 'Succession to Prophet Muhammad' (a disputed topic). Page credits the library project, not a person, as author, so authors left empty. Quotations are attributed to others; not verified.", "desc": "A short collection of brief quotations about Imam Ali from notable people of other faiths, including Thomas Carlyle, Edward Gibbon and Wilferd Madelung. The page credits the Ahlul Bayt Digital Islamic Library Project as compiler.", "file": "data/records/al-islam/al-islam-what-non-muslims-say-about-ali.yaml", "cats": ["level", "sunni", "history", "author", "thin"]}, {"id": "al-islam-zayn-al-abidin-mufid-irshad", "title": "Imam Ali Ibn al Husayn (as)", "source": "al-islam.org", "level": "advanced", "tag": "article", "gran": "work", "url": "https://al-islam.org/articles/imam-ali-ibn-al-husayn-shaykh-al-mufid", "authors": ["Shaykh Muḥammad b. Muḥammad al-Mufīd"], "marja": "", "note": "Page states no audience and the page does not clearly say whether this is an article or a book excerpt (text refers to 'this book'); classical primary source so marked advanced; confirm level and classification.", "desc": "An account of Imam Ali ibn al-Husayn (Zayn al-Abidin), the fourth Imam of the Twelver Shia, taken from a classical work credited on the page to al-Mufid. It opens with his birth and goes on to a brief survey of reports about him.", "file": "data/records/al-islam/al-islam-zayn-al-abidin-mufid-irshad.yaml", "cats": ["level"]}, {"id": "sistani-code-of-practice-west", "title": "A Code of Practice For Muslims in the West", "source": "sistani.org", "level": "intermediate", "tag": "fiqh", "gran": "work", "url": "https://www.sistani.org/english/book/46/", "authors": ["Sayyid Abdul Hadi al-Hakim"], "marja": "sistani", "note": "Level: the Editor's Note says the book aims to make fiqh easier for the layman, so intermediate was chosen rather than advanced; reviewer to confirm. Author is the compiler (Sayyid Abdul Hadi al-Hakim); rulings are Sayyid Sistani's, recorded in `marja`. title_original is the transliterated Arabic title given in the Author's Preface.", "desc": "A book of practical Islamic rulings (fiqh) written for Muslims living in non-Muslim countries, following the views of Sayyid Ali al-Sistani. Each chapter has a short introduction, general rules, and questions and answers, on topics such as prayer, fasting, food, work, marriage and medical issues.", "file": "data/records/sistani/sistani-code-of-practice-west.yaml", "cats": ["level", "ruling", "author"]}, {"id": "sistani-hajj-rituals-2093", "title": "Prohibitions during Ihram", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/47/2093/", "authors": [], "marja": "sistani", "note": "Includes rules on sexual conduct and related penalties for pilgrims in ihram; reviewer to confirm neutral wording.", "desc": "Lists the acts a pilgrim avoids once in ihram, such as hunting, perfume, certain clothing, covering the head, cutting hair and certain personal conduct, and what is owed if one of them is done.", "file": "data/records/sistani/sistani-hajj-rituals-2093.yaml", "cats": ["sexual", "sensitive"]}, {"id": "sistani-hajj-rituals", "title": "Hajj Rituals", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "work", "url": "https://www.sistani.org/english/book/47/", "authors": [], "marja": "sistani", "note": "No foreword, preface or author line on the contents page or the first page (https://www.sistani.org/english/book/47/2082/), so the author or compiler is not named (authors left empty; marja is sistani because the book is published on sistani.org). Level set to advanced because the book calls itself brief but gives no statement of intended audience; it is a detailed, numbered rule manual. Reviewer to confirm.", "desc": "A manual of the rulings (fiqh) for performing Hajj and Umrah, the pilgrimage to Mecca, presented as numbered rules on the site of Sayyid Ali al-Sistani. It runs from who the duty of Hajj applies to, through each stage of the pilgrimage, to recommended acts and supplications.", "file": "data/records/sistani/sistani-hajj-rituals.yaml", "cats": ["level", "author"]}, {"id": "sistani-jme-2397", "title": "Dialogue on Janabah", "source": "sistani.org", "level": "beginner", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/49/2397/", "authors": ["Sayyid Abdul Hadi al-Hakim"], "marja": "sistani", "note": "Sexual topics (janabah and related questions) are discussed in plain terms; reviewer to confirm the wording of the description is suitable.", "desc": "A dialogue on janabah (a state of major ritual impurity that follows sexual activity). Covers how it arises and related questions a young person might have, in plain, matter-of-fact terms.", "file": "data/records/sistani/sistani-jme-2397.yaml", "cats": ["sexual"]}, {"id": "sistani-jme-2422", "title": "Dialogue on miscellaneous issues-2", "source": "sistani.org", "level": "beginner", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/49/2422/", "authors": ["Sayyid Abdul Hadi al-Hakim"], "marja": "sistani", "note": "Covers sexual, reproductive and medical questions (family planning, pregnancy, organ and sperm donation, masturbation); reviewer to confirm neutral wording and heading choice.", "desc": "The second of two dialogues on miscellaneous issues, covering women's matters, medical treatment, family planning, modesty and dress, science and technology topics and organ donation.", "file": "data/records/sistani/sistani-jme-2422.yaml", "cats": ["sexual", "marriage", "heading"]}, {"id": "sistani-jme", "title": "Jurisprudence Made Easy", "source": "sistani.org", "level": "beginner", "tag": "fiqh", "gran": "work", "url": "https://www.sistani.org/english/book/49/", "authors": ["Sayyid Abdul Hadi al-Hakim"], "marja": "sistani", "note": "Level: Author's Preface says the book uses simple, familiar language for the laity and the up-and-coming generation, so beginner was chosen; reviewer to confirm. Author (Abdul Hadi Mohammad Taqi al-Hakim, per the Preface to the English edition, https://www.sistani.org/english/book/49/2390/) matched to scholars.yaml id abdul-hadi-al-hakim; the Arabic-edition introduction (https://www.sistani.org/english/book/49/2391/) says this edition was checked by Sayyid Sistani's office to conform to his edicts, hence marja: sistani. title_original is the transliterated Arabic title given in the Preface.", "desc": "A simplified guide to everyday Islamic rulings (fiqh) written for ordinary readers, following the views of Sayyid Ali al-Sistani. It is set out as conversations between a father and his teenage son on topics such as prayer, fasting, Hajj, khums (a religious payment), trade, marriage and inheritance.", "file": "data/records/sistani/sistani-jme.yaml", "cats": ["level", "author"]}, {"id": "sistani-laws-2134", "title": "IMPURITIES (NAJĀSĀT) » 8. Disbeliever (kāfir)", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2134/", "authors": ["Sayyid Ali al-Sistani"], "marja": "sistani", "note": "Concerns the classification of non-Muslims and sectarian matters; the topic is sensitive, so a knowledgeable human should confirm the neutral description and headings.", "desc": "Rules on how disbelievers (kafir) are treated in the section on impurities, including different categories of people, children, doubts about whether someone is a Muslim, and those who abuse the Imams.", "file": "data/records/sistani/sistani-laws-2134.yaml", "cats": ["faith", "heading", "sensitive"]}, {"id": "sistani-laws-2147", "title": "THINGS THAT PURIFY AN IMPURE OBJECT (MUṬAHHIRĀT) » 7. Islam", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2147/", "authors": ["Sayyid Ali al-Sistani"], "marja": "sistani", "note": "Concerns non-Muslims and conversion; the topic is sensitive, so a knowledgeable human should confirm the neutral description.", "desc": "Rules on how a person's becoming Muslim relates to purity, including the declaration of the two testimonies (shahadatayn) and what applies to their clothes and body.", "file": "data/records/sistani/sistani-laws-2147.yaml", "cats": ["faith", "sensitive"]}, {"id": "sistani-laws-2148", "title": "THINGS THAT PURIFY AN IMPURE OBJECT (MUṬAHHIRĀT) » 8. Subsequence (tabaʿiyyah)", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2148/", "authors": ["Sayyid Ali al-Sistani"], "marja": "sistani", "note": "Includes rulings about the children of non-Muslims; sensitive topic, so a knowledgeable human should confirm the neutral description.", "desc": "How does a child's purity relate to a parent's conversion?", "file": "data/records/sistani/sistani-laws-2148.yaml", "cats": ["faith", "ruling", "sensitive"]}, {"id": "sistani-laws-2162", "title": "LAWS OF RITUAL IMPURITY (JANĀBAH)", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2162/", "authors": ["Sayyid Ali al-Sistani"], "marja": "sistani", "note": "Concerns sexual matters; the description is kept to the topic, so a knowledgeable human should confirm the wording and headings.", "desc": "Rules on janabah (major ritual impurity): how a person enters this state, and doubts about discharged fluid and its type, for both men and women.", "file": "data/records/sistani/sistani-laws-2162.yaml", "cats": ["sexual", "heading"]}, {"id": "sistani-laws-2172", "title": "LAWS OF A WOMAN IN MENSTRUATION (ḤĀʾIḌ)", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2172/", "authors": ["Sayyid Ali al-Sistani"], "marja": "sistani", "note": "Includes rulings on sexual relations during menstruation; sensitive topic, so a knowledgeable human should confirm the wording and headings.", "desc": "Covers the laws for a woman during menstruation (haid): the acts of worship and other matters that are restricted for her, along with the matters of intercourse and what applies in different cases.", "file": "data/records/sistani/sistani-laws-2172.yaml", "cats": ["sexual", "ruling", "heading", "sensitive"]}, {"id": "sistani-laws-2269", "title": "CHAPTER THREE » Prayer (Ṣalāh) » CONDITIONS OF THE IMAM OF CONGREGATIONAL PRAYERS", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2269/", "authors": [], "marja": "sistani", "note": "Page states conditions on the imam's creed (Twelver Shia), a Shia-Sunni matter; flagged for human review.", "desc": "Covers the qualifications of the imam (prayer leader) of a congregational prayer, including age, mind, character and creed, and rulings on following imams with excuses or illnesses.", "file": "data/records/sistani/sistani-laws-2269.yaml", "cats": ["sunni"]}, {"id": "sistani-laws-2281", "title": "CHAPTER FOUR » Fasting (Ṣawm) » THINGS THAT INVALIDATE (MUBṬILĀT) A FAST » 2. Sexual intercourse", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2281/", "authors": [], "marja": "sistani", "note": "Sexual matter; cataloged neutrally by topic only.", "desc": "Covers the rulings on sexual intercourse in relation to the fast, including cases of intention, forgetting, and compulsion. Described here only by topic.", "file": "data/records/sistani/sista istani-laws-2311", "title": "CHAPTER SIX » The One-Fifth Tax (Khums) » 6. SPOILS OF WAR", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2311/", "authors": [], "marja": "sistani", "note": "Concerns war and relations with non-Muslims; cataloged neutrally by topic.", "desc": "Covers khums on spoils of war, the rules that apply when war is fought with or without authorisation, and the treatment of property taken from combatants.", "file": "data/records/sistani/sistani-laws-2311.yaml", "cats": ["faith"]}, {"id": "sistani-laws-2325", "title": "CHAPTER EIGHT » Alms Tax (Zakat) » CRITERIA FOR BEING ENTITLED (MUSTAḤIQQ) TO RECEIVE ZAKAT", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2325/", "authors": [], "marja": "sistani", "note": "Includes conditions on the recipient's creed (Twelver Shia), a Shia-Sunni matter; flagged for review.", "desc": "Covers the criteria of someone entitled to receive zakat, including their creed, children and minors, relatives, dependants, spouses, sayyids and people unknown to the giver.", "file": "data/records/sistani/sistani-laws-2325.yaml", "cats": ["sunni"]}, {"id": "sistani-laws-2329", "title": "CHAPTER EIGHT » Alms Tax (Zakat) » DISTRIBUTION OF ZAKĀT AL‑FIṬRAH", "source": "sistani.org", "level": "advanced", "tag": "fiqh", "gran": "section", "url": "https://www.sistani.org/english/book/48/2329/", "authors": [], "marja": "sistani", "note": "Includes a condition on the recipient's creed (Shia), a Shia-Sunni matter; flagged for review.", "desc": "Covers who can receive zakat al-fitrah (the alms given at the end of Ramadan), poor children, the kinds and amounts of items given, and giving it to someone mistakenly thought to be poor.", "file": "data/records/sistani/sistani-laws-2329.yaml", "cats": ["sunni"]}, {"id": "sistani-laws-2366", "title": "CHAPTER TWENTY-SEVEN » Marriage » CONDI ng of the Shia community and its place among followers of the Prophet. It is a primary source for readers with some background.", "file": "data/records/thaqalayn/thaqalayn-fadail-al-shia.yaml", "cats": ["heading"]}, {"id": "thaqalayn-kitab-al-duafa", "title": "Kitāb al-Ḍuʿafāʾ: The Weakened Ones", "source": "thaqalayn.net", "level": "advanced", "tag": "book", "gran": "work", "url": "https://thaqalayn.com/book/17", "authors": ["Abū al-Ḥusayn Aḥmad b. al-Ḥusayn al-Ghaḍā'irī"], "marja": "", "note": "The page itself describes this as a rijal (narrator-evaluation) work, so it is typed as a book rather than a hadith collection. The page's title says 'Attributed to Ibn al-Ghada'iri' and its text says scholars have disputed the book's authorship; the author link is kept only because the page names him.", "desc": "A biographical reference on narrators of Shia hadith and their reliability, shown with an English translation by Tashayyu. The site says it is organised alphabetically and is also known as 'Rijal Ibn al-Ghada'iri' (rijal means the study of narrators). It is not a hadith collection; it is a tool for studying who transmitted hadith.", "file": "data/records/thaqalayn/thaqalayn-kitab-al-duafa.yaml", "cats": ["history", "author"]}, {"id": "thaqalayn-kitab-al-ghayba-tusi", "title": "Kitāb al-Ghayba: The Book of Occultation", "source": "thaqalayn.net", "level": "advanced", "tag": "hadith", "gran": "work", "url": "https://thaqalayn.com/book/27", "authors": ["Shaykh Muḥammad b. al-Ḥasan al-Ṭūsī"], "marja": "", "note": "Level set to advanced by default for a primary source. The site lists two different books titled 'Kitāb al-Ghayba' (this one by al-Ṭūsī at /book/27 and one by al-Nuʿmānī at /book/22); the id carries the author's name to keep them apart. The site describes the book as responding to other sects; a reviewer should confirm the headings.", "desc": "A book by Shaykh al-Tusi on the occultation (ghayba, meaning being hidden from view) of the twelfth Imam, al-Mahdi; s    el('div',{class:'meta',text:`${r.source} · ${r.gran} · ${r.tag} · ${r.level}${r.authors.length?' · '+r.authors.join(', '):''}${r.marja?' · rulings of '+r.marja:''}`}),
   el('div',{class:'note',text:r.note||'(no note)'}),
   el('details',null,el('summary',{text:'What the record says'}),el('p',{text:r.desc})),
   el('div',{class:'tags'},r.cats.map(c=>el('span',{text:D.labels[c]}))),
   el('p',{class:'meta'},el('a',{href:r.url,target:'_blank',rel:'noopener noreferrer',text:'Open the source page ↗'}),' · ',el('code',{text:r.file}))));
 }
 if(out.length>200)L.append(el('p',{class:'mut',text:`Showing the first 200 of ${out.length}. Narrow the filters to see the rest.`}));
}
for(const id of ['#q','#src','#lvl','#gran'])$(id).addEventListener('input',draw);
draw();
</script></body></html>
