# Checks the catalog on every push and pull request: validates the records, builds the search
# index and runs the search evaluation. The site itself is published by Cloudflare Pages
# (output directory: site; build command: python3 scripts/build_index.py).
name: Catalog checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pyyaml
      - name: Validate catalog
        run: python3 scripts/validate.py
      - name: Build search index
        run: python3 scripts/build_index.py
      - name: Run search evaluation
        run: node scripts/eval_search.mjs
