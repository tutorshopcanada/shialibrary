# Search synonyms: words and phrases that mean the SAME thing (search proposal phase C).
#
# DRAFT for owner / scholar review. Written by the cataloging agent on 2026-11-19.
#
# How it differs from heading alternate terms (data/vocabulary.yaml, data/arabic-terms.yaml): a heading's terms
# name a whole TOPIC, so typing one gives a small boost to every page under that topic. A synonym group says
# that its terms are interchangeable WORDS: a page that says "temporary marriage" matches a search for "mutah"
# exactly as if it had said "mutah", and nothing else is pulled in. Use a group only for real equivalents,
# never for "related" words.
#
# Fields:
#   id        short name (letters, digits, hyphens)
#   meaning   plain-English gloss, for the reviewer
#   terms     the equivalent spellings, transliterations, translations and plain-English phrasings
#   not_before (optional) words that cancel a match when they come straight after it, e.g. "imam ali" must not
#             match "Imam Ali al-Ridha"
# contexts: an ambiguous word that means a group only next to certain other words in the same query
#   ("stone" means the turbah only in a question about praying).
#
# scripts/build_index.py copies this file into the index; site/js/search.js applies it to records and queries.
draft: true
groups:
