contexts:
  # "stone" in a question about praying means the turbah, not the Black Stone of the Kaaba.
  - word: stone
    with: [pray, prays, prayer, prayers, praying, sajdah, sajda, sujud, prostrate, prostration, namaz, salat, salah]
    means: turbah
  - word: stones
    with: [pray, prays, prayer, prayers, praying, sajdah, sajda, sujud, prostrate, prostration, namaz, salat, salah]
    means: turbah
  # "period" next to a woman, mosque, prayer or fasting means menstruation, not a period of time.
  - word: period
    with: [woman, women, girl, girls, mosque, masjid, pray, prayer, fast, fasting, quran, touch, wudu, ghusl, her, she]
    means: haydh
