# Search-only synonym table: Arabic (and a few Persian/Urdu) words, their transliterations and plain-English
# meanings, each pointed at headings that ALREADY exist in data/vocabulary.yaml.
#
# This file does not change the vocabulary. scripts/build_index.py adds each entry's `terms` to the alternate
# terms of its `headings` inside site/data/index.json only, so a query in any of these forms behaves like the
# heading's own alternate terms. It is a hand-built table, not a model.
#
# Rules for editing: `headings` must be existing heading ids (the build stops otherwise). `meaning` is the
# English gloss, kept here so the owner or a scholar can check each entry. Add only words you can verify.
# DRAFT: all entries are for owner / scholar review.
entries:
  # ---- Beliefs ----
  - meaning: "ʿiṣmah: infallibility, being protected from sin and error (said of the prophets and the Imams); maʿṣūm: an infallible person"
