id: path-learning-about-prayer
title: Learning about prayer
intro: Start with a general introduction that explains the daily prayers, then see common questions about praying together, why prayer matters,
  and the detailed rulings of Sayyid Sistani. The rulings pages are labelled Fiqh.
steps:
