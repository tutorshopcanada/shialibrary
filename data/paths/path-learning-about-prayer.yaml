- record: sistani-qa-congregational-prayers
  why: Questions and answers on praying together in congregation. Detailed rulings.
- record: sistani-west-salat-introduction
  why: A short piece on why prayer matters, from a book of Sayyid Sistani's rulings.
- record: sistani-west-salat-general-rules
  why: General rules on prayer, including when travelling. Detailed rulings.
