description: Tafsir al-Mizan is a full commentary on the Qur'an by ʿAllāmah Muḥammad Ḥusayn al-Ṭabāṭabāʾī (1904–1981), a Shia scholar. This site presents its English text free to read online, verse by verse. The commentator's method is to explain the Qur'an through the Qur'an itself, alongside narrations from the Prophet and his family.
