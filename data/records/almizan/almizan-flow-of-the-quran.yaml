description: A study page on a principle the commentator calls the "flow" (jary) of the Qur'an. The principle holds that a verse applies wherever its meaning applies, not only to the event it was revealed about. The page gathers the passages where he sets out the principle and the places where he uses it.
sample_questions:
- Does a verse of the Quran apply only to the event it came down about?
- What does the flow of the Quran mean?
- How does the commentary apply verses to later times?
- What is jary in the Quran?
