description: A hadith collection (reported sayings of the Prophet and the Imams) about Imam al-Rida, compiled
  by Shaykh al-Saduq and shown with an English translation by Dr. Ali Peiravi. Volume 1 of 2 begins with
  a foreword and traditions about the Imam's birth, mother and name. It then covers his father Imam al-Kazim,
  Imam al-Kazim's will, proofs of the Imam's divine leadership, and his debates on divine unity with al-Ma'mun
  and others. It is a primary source for readers with some background.
