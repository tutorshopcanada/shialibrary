description: A hadith collection (reported sayings of the Prophet and the Imams) compiled by Shaykh Muhammad Asif al-Muhsini,
  shown with an English translation by Ammaar Muslim. The site says he gathered narrations he judged reliable, using
  criteria it describes, and notes that some scholars may differ with his judgments. Chapters cover intellect and knowledge,
  principles of jurisprudence, narrators, divine unity and the Quran.
