description: A hadith collection (reported sayings of the Prophet and the Imams) compiled by Shaykh Muhammad
  Asif al-Muhsini, shown with an English translation by Ammaar Muslim. The site says he gathered narrations
  he judged reliable, using criteria it describes, and notes that some scholars may differ with his judgments.
  Its five books cover intellect and knowledge, the principles of jurisprudence (how rulings are derived
  from the sources), a list of narrators, divine unity, and the Quran and its recitation.
