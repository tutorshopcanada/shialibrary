description: A collection of hadith (reported sayings of the Prophet and the Imams) compiled by Shaykh
  al-Saduq and arranged by the numbers mentioned in them, from one-numbered characteristics upward; shown
  in Arabic with an English translation by Dr. Ali Peiravi. It has an introduction and 28 parts. Each
  part groups narrations that list a given number of characteristics, from one up to more than one thousand.
  According to the site the narrations range over history, doctrine, ethics and jurisprudence. It is a
  primary source for readers with some background.
