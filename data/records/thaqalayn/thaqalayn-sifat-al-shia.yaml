description: A collection of 71 hadith (reported sayings of the Ahl al-Bayt) compiled by Shaykh al-Saduq,
  shown with an English translation by Badr Shahin. Its chapters describe the character and conduct expected
  of Shia, including piety and worship, sincerity in faith, the influence of companions on character,
  and the practice of taqiyah (concealing one's belief under threat). They also include warnings about
  faults among those who follow the Imams. It is a primary source for readers with some background.
