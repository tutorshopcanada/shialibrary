description: 'Al-Kafi is a collection of hadith (reported sayings of the Prophet and the Imams) compiled
  by Shaykh al-Kulayni, shown here in Arabic with an English translation by Muhammad Sarwar. Volume 1
  of 8 has five books: an introduction, intelligence and ignorance, the virtue of knowledge, the oneness
  of God, and those with divine authority. This page also gives an overview of all eight volumes. It is
  a primary source, best suited to readers who already know the basics.'
