description: A work by Shaykh al-Saduq on the occultation (ghayba, meaning being hidden from view) of
  the twelfth Imam, Muhammad al-Mahdi, and on the Imamate, shown with an English translation by Sayyid
  Athar Husain S. H. Rizvi. Its first section covers the author's introduction, the necessity of the Imamate
  and the Imam's infallibility. The second section, 'The Occultations and the Proofs', begins with accounts
  of earlier prophets who were hidden for periods, such as Idris and Yusuf. It is a primary source for
  readers with some background.
