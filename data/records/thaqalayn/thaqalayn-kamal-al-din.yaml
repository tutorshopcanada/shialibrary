description: A work by Shaykh al-Saduq on the occultation (ghayba, meaning being hidden from view) of the twelfth Imam,
  Muhammad al-Mahdi, and on the Imamate, shown with an English translation by Sayyid Athar Husain S. H. Rizvi. The site
  describes it as a theological and historical work with a systematic defense of the doctrine of occultation. It is a
  primary source for readers with some background.
