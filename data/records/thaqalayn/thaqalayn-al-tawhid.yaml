description: A collection of hadith (reported sayings of the Prophet and the Imams) about God, compiled by Shaykh
  al-Saduq and shown in Arabic with an English translation by Sayed Ali Raza Rizvi. According to the site it covers
  themes such as God's oneness and attributes, free will and predestination, and the nature of the Quran. It is
  a primary source for readers who want to see the narrations behind Shia beliefs about God.
