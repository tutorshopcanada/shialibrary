description: A collection of hadith (reported sayings of the Prophet and the Imams) about God, compiled
  by Shaykh al-Saduq and translated into English by Sayed Ali Raza Rizvi. Its chapters cover God's names
  and attributes, God's knowledge, will, power and speech, the nature of the Quran, free will and predestination,
  divine justice and guidance, and arguments against atheists and dualists. It is a primary source for
  readers who want the narrations behind Shia beliefs about God.
