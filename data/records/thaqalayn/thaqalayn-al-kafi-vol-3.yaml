description: Al-Kafi is a collection of hadith (reported sayings of the Prophet and the Imams) compiled by Shaykh
  al-Kulayni, shown here in Arabic with an English translation by Muhammad Sarwar. Volume 3 of 8 gathers narrations
  arranged under books on ritual cleansing, menstruation, dying people, prayer and zakat (a religious charity payment).
  It is a primary source of narrations, not a guide to current rulings, and suits readers with some background.
