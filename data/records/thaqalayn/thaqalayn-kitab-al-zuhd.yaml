description: A collection of nearly three hundred narrations on ethics, character and zuhd (asceticism, meaning self-discipline
  and detachment from worldly things), compiled by al-Husayn b. Sa'id al-Ahwazi and shown with an English translation
  by Shaykh Tahir Ridha Jaffer. The site says it focuses on the teachings of the Ahl al-Bayt. It is a primary source
  for readers with some background.
