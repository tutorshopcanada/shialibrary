description: A collection of nearly three hundred narrations on ethics, character and zuhd (asceticism,
  meaning self-discipline and detachment from worldly things), compiled by al-Husayn b. Sa'id al-Ahwazi
  and shown with an English translation by Shaykh Tahir Ridha Jaffer. Its chapters cover silence and good
  speech, good character and anger, kindness to parents and relatives, the rights of neighbours, this
  world, humility and arrogance, showing off, repentance, death and the grave, and paradise and hell.
  It is a primary source for readers with some background.
