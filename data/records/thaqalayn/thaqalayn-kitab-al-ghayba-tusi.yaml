description: A book by Shaykh al-Tusi on the occultation (ghayba, meaning being hidden from view) of the
  twelfth Imam, al-Mahdi; shown in Arabic with an English translation by Sayyid Athar Husain S. H. Rizvi.
  According to the site it combines arguments and hadith (reported sayings of the Prophet and the Imams)
  on the occultation, the Imam's deputies and the signs of his return. It is a detailed primary source
  for readers with some background.
