description: Volume 3 of 5 of Man La Yahduruh al-Faqih, a hadith collection (reported
  sayings of the Prophet and the Imams) compiled by Shaykh al-Saduq, shown with an
  English translation by Bab Ul Qaim Publications. The site calls it a handbook for
  someone without access to a jurist. This volume contains the books on marriage (nikah),
  divorce (talaq), legal cases and rulings, and livelihood (earning a living, trade
  and debt), and it is a primary source.
