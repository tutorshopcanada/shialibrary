description: A short collection of 45 selected hadith (reported sayings of the Imams) compiled by Shaykh
  al-Saduq, shown with an English translation by Badr Shahin. Its chapters cover the Prophet's praise
  of Imam Ali, love for Ali and the Ahl al-Bayt (the Prophet's family), the virtues and divine favour
  of the Shia, and accountability on the Day of Judgment. It is a primary source for readers with some
  background.
