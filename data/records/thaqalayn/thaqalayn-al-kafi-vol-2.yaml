description: Al-Kafi is a collection of hadith (reported sayings of the Prophet and the Imams) compiled by Shaykh
  al-Kulayni, shown here in Arabic with an English translation by Muhammad Sarwar. Volume 2 of 8 gathers narrations
  on belief and disbelief, supplication (dua, calling on God), the excellence of the Quran, and social manners.
  It is a primary source, best suited to readers who already know the basics.
