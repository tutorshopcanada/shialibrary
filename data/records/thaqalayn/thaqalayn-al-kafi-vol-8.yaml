description: Al-Kafi is a collection of hadith (reported sayings of the Prophet and
  the Imams) compiled by Shaykh al-Kulayni, shown here in Arabic with an English translation
  by Muhammad Sarwar. Volume 8 of 8, called al-Rawda (the Garden), is a miscellaneous
  collection that the site says includes long narrations from letters and wills of
  the Imams and historical reports, not arranged by topic. Its 596 short chapters
  touch on many subjects, such as asceticism (zuhd), the Day of Judgment, dreams and
  the worthlessness of worldly life. It is a primary source, best suited to readers
  with some background.
