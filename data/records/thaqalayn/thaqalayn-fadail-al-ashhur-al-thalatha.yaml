description: A compilation of reports by Shaykh al-Saduq about the spiritual significance and recommended
  acts of worship of the months of Rajab, Sha'ban and Ramadan, shown with an English translation by Haseeb
  Hassan. Its three sections are one for each month. The Ramadan section is the largest and includes reports
  on prayers for the last night of the month and on farewelling it. It is a primary source.
