description: An early hadith collection (reported sayings of the Prophet and the Imams) on divine leadership
  (the Imamate) compiled by 'Ali ibn Babawayh, the father of Shaykh al-Saduq according to the site, shown
  with an English translation by Haseeb Hassan. Its chapters cover the succession of divine authority
  from Adam, the Imams one by one from Imam Ali to the Mahdi, reasons for differences between narrations,
  the descriptions of the Mahdi, the occultation, and the signs of his reappearance. Its third section
  is an addendum. It is a primary source.
