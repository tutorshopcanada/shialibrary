description: An early hadith collection (reported sayings of the Prophet and the Imams) on divine leadership (the Imamate)
  compiled by ʿAli ibn Babawayh, the father of Shaykh al-Saduq according to the site, shown with an English translation
  by Haseeb Hassan. It covers the succession of the Imams, and an addendum covers the Mahdi and his occultation. It is
  a primary source.
