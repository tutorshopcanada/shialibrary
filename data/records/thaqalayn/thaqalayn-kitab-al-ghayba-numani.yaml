description: A book by Shaykh al-Nu'mani on the occultation (ghayba, meaning being hidden from view) of the twelfth Imam,
  shown in Arabic with an English translation by Abdullah al-Shahin. The site says it has about 478 narrations in twenty-six
  chapters, on the Imamate, hardships of the Shia, signs of the Imam's reappearance and his governance after the occultation.
  It is a primary source.
