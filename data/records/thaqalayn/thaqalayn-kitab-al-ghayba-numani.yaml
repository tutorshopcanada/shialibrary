description: A book by Shaykh al-Nu'mani on the occultation (ghayba, meaning being hidden from view) of
  the twelfth Imam, shown in Arabic with an English translation by Abdullah al-Shahin. It has about 478
  narrations in twenty-six chapters. Its chapters cover the Imamate and the twelve Imams, pretenders to
  the Imamate, patience and doubt during the occultation, the signs before the reappearance of al-Qa'im
  (the awaited Imam), the Sufyani, and the Imam's age. It is a primary source.
