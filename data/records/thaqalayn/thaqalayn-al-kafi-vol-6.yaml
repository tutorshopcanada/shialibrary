description: Volume 6 of 8 of Al-Kafi, a collection of hadith (reported sayings of the Prophet and the Imams) compiled
  by Shaykh al-Kulayni, shown with an English translation by Muhammad Sarwar. According to the site, this volume includes
  the books on aqiqah (offering an animal for a newborn), divorce, hunting, slaughtering, food, drinks, dress and domestic
  animals. It is a primary source, best suited to readers who already know the basics.
