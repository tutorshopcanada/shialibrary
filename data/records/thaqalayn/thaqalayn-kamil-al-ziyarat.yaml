description: A collection of narrations about ziyara, the practice of visiting sacred sites of the Shia, compiled
  by Ibn Qulawayh al-Qummi and shown in Arabic with an English translation by Sayyid Mohsen Al-Husayni Al-Milani.
  According to the site it covers the purposes of ziyara, the rewards and etiquette of visiting, and the recitations
  to read, with most of the book about visiting Imam Husayn. It is a primary source rather than an introduction.
