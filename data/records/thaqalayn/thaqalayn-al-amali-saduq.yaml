description: A transcription of 97 assemblies in which Shaykh al-Saduq dictated narrations to his students, shown with
  an English translation by Bilal Muhammad. The site says it holds 1082 narrations attributed to the Prophet and the
  Ahl al-Bayt (the Prophet's family), including topics such as the Night Journey and Ascension, supplications and the
  virtues of the Ahl al-Bayt. It is a primary source.
