description: A collection of 201 traditions on faith (iman) and the believer, compiled by al-Husayn b. Sa'id al-Ahwazi
  and shown with an English translation by Muhajir b. Ali. According to the site, it covers a believer's trials, the
  honours given to believers, their rights over each other and the reward of helping one another. It is a primary source
  for readers with some background.
