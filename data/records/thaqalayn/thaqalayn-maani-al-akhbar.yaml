description: A collection of 809 hadith (reported sayings of the Prophet and the Imams) compiled by Shaykh al-Saduq,
  shown with an English translation by Basel Kadem. The site says it explains about 500 terms and concepts from the Quran,
  hadith, theology and law, and groups its content into Quranic, legal, theological, ethical and historical hadith. It
  is a primary source for readers with some background.
