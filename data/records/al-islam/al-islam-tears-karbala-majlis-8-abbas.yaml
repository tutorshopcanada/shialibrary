description: The eighth majlis in Tears For Karbala, for the eighth night of Muharram. It focuses on Hazrat Abbas, who had a role as standard-bearer at Karbala, and covers his attempt to bring water to the camp and his death, along with Imam Husayn's grief. The book presents these majalis to children.
