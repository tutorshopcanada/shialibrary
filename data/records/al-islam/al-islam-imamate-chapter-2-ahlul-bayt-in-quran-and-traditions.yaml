description: The second chapter of the book Imamate and The Imams, on the Ahlul Bayt, the family of the
  Prophet, as the chapter discusses them in the Quran and in traditions. It covers the Tat'hir verse, the
  Ghadir tradition, the Prophet's recommendations about the Ahlul Bayt, and some beliefs the chapter warns
  against. It is a long chapter with many references.
