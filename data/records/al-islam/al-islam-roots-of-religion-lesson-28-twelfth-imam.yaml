description: Lesson 28 of The Roots of Religion, a series of thirty lessons. It introduces belief in the
  twelfth Imam, Muhammad al-Mahdi, covering his birth, the period of minor occultation (hiddenness) with
  special representatives and the major occultation that followed. It cites Qur'anic verses and hadith
  collections, including Sunni sources, and gives the reasons it offers for the Imam's hiddenness and
  the benefits of his existence.
