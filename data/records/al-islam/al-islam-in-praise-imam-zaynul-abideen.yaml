description: 'A very short page presenting a poem in praise of Imam Zayn al-Abidin, the fourth Imam. The
  page explains the occasion: during Hajj, the Caliph Hisham ibn Abd al-Malik was overshadowed by the
  respect people showed the Imam, and the poet Farazdaq then recited an ode.'
