description: A chapter of The Life of Ali Ibn Abi Talib on how Imam Ali chose, instructed and held to account
  the governors and officials of his government, drawing on his letter to Malik al-Ashtar. It also covers
  tax collectors, the army, and the police force he founded, which the chapter calls Shurtat al-Khamis
  ("the military police") and names some of its members, followed by profiles of governors such as Qays
  ibn Sa'd and Malik al-Ashtar.
sample_questions:
