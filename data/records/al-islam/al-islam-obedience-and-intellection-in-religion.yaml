description: A long scholarly article on the relationship between obedience (ta'abbud) and reasoning (ta'aqqul)
  in religion. It uses case studies of Kierkegaard and Mostafa Malekian, defines obedience, and asks how
  far reasoning applies to worship. It is based on lessons by Shaykh Haider Hobollah.
