description: A book about the life and character of Lady Zaynab, a daughter of Imam Ali and a member of
  the Prophet's family (the Ahl al-Bayt). It follows her life through the periods of the caliphs, Imam
  Ali, Imam al-Hasan and Mu'awiyah, then Karbala, Ashura and her captivity afterwards. The site says it
  sheds light on her personality.
