description: A book that the site describes as a concise look at key aspects of Shia Islam, starting from
  the roots of the religion (core beliefs) and its branches (main practices). Later sections explain Shia
  practices that people often ask about, such as details of the call to prayer and the daily prayer and
  praying on a turbah (a small clay tablet), and include sayings about the Prophet's family.
