description: A technical article by Ja'far Subhani on questions about the Ziyarat Ashura, a visitation text associated with Imam Husayn. It discusses how far traditions (reports) can be relied on, the weight of reports whose chains of transmission are weak, and the principles scholars use when evaluating them.
sample_questions:
- What is Ziyarat Ashura?
- How are Islamic traditions judged for reliability?
- What makes a report weak in Islamic scholarship?
- What is the Book of Biographies of al-Ghada'iri?
- How do scholars judge the chain of transmission of a report?
