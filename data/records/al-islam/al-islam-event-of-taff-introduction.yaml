description: The introduction to The Event of Taff. It covers how early Muslims came to record
  history, who Abu Mikhnaf was, his family, works and reliability as judged by early Shia scholars, how
  his account of Karbala was passed down, and why it considers the Maqtal (martyrdom narrative)
  in common circulation under his name to be a later compilation with errors.
