description: An article that walks through the events leading to the battle of Karbala and the day of
  Ashura, when Imam Husayn, the Prophet's grandson, was killed. It gives background on the rulers Mu'awiya
  and Yazid, follows Imam Husayn's journey to Karbala and the battle itself, and ends with lessons drawn
  from it and a glossary.
