description: The seventh majlis in Tears For Karbala, for the seventh night of Muharram. It tells of Qasim, a young son of Imam Hasan, who was killed at Karbala, and describes the family's grief. It also includes the calls to mourn, give donations and volunteer that the text makes. The book presents these majalis to children.
