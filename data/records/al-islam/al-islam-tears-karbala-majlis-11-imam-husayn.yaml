description: The eleventh majlis in Tears For Karbala, for the Day of Ashura, the tenth of Muharram. It narrates the events of the battle of Karbala, including the deaths of Imam Husayn's companions and family members, his farewells to his family, and his final moments. The book presents these majalis to children.
