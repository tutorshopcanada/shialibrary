description: The question asks how to understand two Qur'an verses (2:254 and 2:255) that seem to say both that intercession is not allowed and that it is allowed. It is about interpreting apparently conflicting verses on intercession.
sample_questions:
- Does the Qur'an allow intercession on the Day of Judgment?
- What does Qur'an 2:255 say about intercession?
- Is there a contradiction about intercession in the Qur'an?
