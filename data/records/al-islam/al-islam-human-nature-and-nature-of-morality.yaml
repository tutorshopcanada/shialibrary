description: A journal article by Mohammad Ali Shomali, published in the Journal of Religious Thought of Shiraz University (No. 25, Winter 2008), on where morality comes from and what it rests on. It discusses human nature and self-love, how moral decisions are made, what moral terms mean, and relativism and absolutism. It is a philosophical article with a bibliography.
