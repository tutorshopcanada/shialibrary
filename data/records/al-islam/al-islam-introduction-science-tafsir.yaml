description: A book about the rules and approach to be used when interpreting the Quran (tafsir means
  Quran commentary). Its parts cover topics such as Arabic grammar, word meanings, the occasions when
  verses were revealed, and understanding the history and setting of the revelation. The site describes
  it as a discussion of the rules governing interpretation of the Quran.
