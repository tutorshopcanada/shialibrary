description: A biography of Fatimah, the daughter of the Prophet Muhammad, by Yasin T. Al-Jibouri. Despite its title ("a brief biography") the article is long. It follows her life from her marriage through the period after the Prophet's death, including the dispute over the property of Fadak and a text the article calls Fatima's Mushaf, and it ends with her death.
