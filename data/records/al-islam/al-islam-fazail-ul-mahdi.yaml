description: A book by Ali Akbar Talaafi that the site describes as a short biography of Imam al-Mahdi,
  the twelfth Imam, and a discussion of his reappearance, his lineage and the reasons for his occultation
  (ghaybah, his absence from public view). It also covers how believers should behave while waiting for
  him.
