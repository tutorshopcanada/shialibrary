description: An English translation of Abu Mikhnaf's account of the tragedy of Karbala, the earliest
  surviving historical narration of the martyrdom of Imam Husayn, in a revised edition researched and
  edited by Muhammad Hadi al-Yusufi al-Gharawi. It follows the events in order, from Imam Husayn leaving
  Madinah and the journey toward Kufah to the day of Ashura and what happened to his family afterward.
