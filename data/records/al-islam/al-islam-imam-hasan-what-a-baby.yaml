description: A short section of the book Imam Hasan bin Ali about the birth of Imam Hasan, the first grandson of the Prophet. It describes the Prophet's welcome for the baby, including the call to prayer and the naming, and gives the birth date as the fifteenth of Ramadan in the third year after the Hijrah, the Prophet's migration to Medina.
