description: The first chapter of the book Imamate and The Imams, which explains what Imamate (leadership
  after the Prophet) means in Shia belief. It covers the meaning of the word imam, the Prophet's position
  and the Imam's duties, the qualities of an Imam, why the chapter says the Imam must be obeyed, the sources
  of the Imams' knowledge, and infallibility.
