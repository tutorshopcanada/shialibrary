description: An excerpt from the classical book Kitab al-Irshad (The Book of Guidance) by Shaykh al-Mufid
  about Imam Muhammad al-Baqir, the fifth Imam of the Twelver Shia. It covers his birth, the evidence
  for his Imamate (leadership after the Prophet), his age, his death and burial place, and an account
  of his brothers.
