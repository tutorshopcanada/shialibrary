description: The final part of the Faiths in Creation series, by Mohammad Ali Shomali (2008), on the Islamic view of the natural world. It presents Quranic verses and hadith about nature, the responsibilities the article describes for people as guardians of the environment, and the virtues and vices related to how people treat it, such as moderation and wastefulness.
