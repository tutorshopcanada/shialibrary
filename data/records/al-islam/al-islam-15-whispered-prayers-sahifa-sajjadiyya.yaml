description: A collection of fifteen personal prayers (munajat, meaning whispered or intimate prayers)
  taken from the Sahifa Sajjadiyya, a book of supplications credited to Imam Ali Zayn al-Abidin, the fourth
  Imam. Each prayer is named for a type of person, such as the repenters, the hopeful, the thankful and
  the lovers. The page has an introduction.
