description: A book on the Ghadir event, which Shias hold to be when the Prophet spoke about Ali's leadership,
  and on the sermon given there. It has an introduction to the event, a discussion of what the sermon
  establishes, obligations the author draws from it, and a translation of the sermon in ten parts.
