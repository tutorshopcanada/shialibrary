description: An article by Mansour Leghaei that explains the status of Imam Ali, the first Imam in Twelver belief. It discusses what an Imam is, addresses the question of whether Shias follow Imam Ali rather than the Prophet Muhammad, and describes Imam Ali through a series of titles, such as Imam of the believers and Imam of those who pray. It has numbered footnotes.
