description: A short book by Sayyid Muhammad Husayn Tabataba'i that the site describes as a summary of the teachings of Islam, written in relatively simple language. It covers belief in God, prophethood, the Qur'an, the Prophet and his family, the Imamate (the belief in leaders after the Prophet), the afterlife, ethics and religious commandments.
