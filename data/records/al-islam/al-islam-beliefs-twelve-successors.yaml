description: A web article that discusses the hadiths about twelve successors of the Prophet and how various
  Sunni scholars have interpreted them. It presents the Twelver Shia view that the twelve are the Imams
  from the Prophet's family, and cites narrations on this question. It is for readers interested in the
  Shia belief about the imamate.
