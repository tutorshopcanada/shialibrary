description: The second majlis (gathering talk) in Tears For Karbala, for the second night of Muharram. It covers Imam Husayn's arrival at Karbala, the land he bought there, the dispute over where the camp could pitch its tents, and the thirst the camp suffered from the seventh of Muharram. The book presents these majalis to children.
sample_questions:
- What happened when Imam Husayn arrived at Karbala?
- Why did the camp suffer from thirst at Karbala?
- Who bought the land where the camp stopped at Karbala?
- Who was Imam Husayn?
- What happened during the first days of Muharram at Karbala?
