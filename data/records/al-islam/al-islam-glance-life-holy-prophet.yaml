description: A book that tells the life of the Prophet Muhammad in 18 chapters, from the pre-Islamic world
  through his birth, marriages, the beginning of revelation, the migration to Madina and the wars of his
  time, to his last days. The site describes it as a structured narrative. It includes a chapter on Ghadir,
  a disputed point of early history.
