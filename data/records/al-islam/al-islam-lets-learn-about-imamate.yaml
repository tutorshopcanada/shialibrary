description: A short lesson-style book on imamate, the Shia belief in divinely appointed leaders after the
  Prophet. Its ten lessons cover what an Imam is and why one is needed, the Imams' qualities, evidence the
  author draws from the Quran and sayings of the Prophet, the Twelve Imams and the Twelfth Imam, the Mahdi.
  Each lesson ends with questions to think about.
sample_questions:
- What is imamate?
- Why do Shias believe in Imams?
- Who are the twelve Imams?
- What is the Hadith of Ghadir?
- What is the Hadith of Thaqalayn?
- Who is the Twelfth Imam?
- Who chooses the Imam?
