description: A book of ten short lessons on the Islamic way of raising children, which the site says draw
  on Islamic sources originally written in Farsi. Lessons cover the mother's role, religious training, a
  child's need for love, self-esteem, discipline, play, outside influences, sibling rivalry and common
  mistakes parents make. It ends with a dua for virtuous children.
sample_questions:
- How should children be raised in Islam?
- How do I teach my child about religion?
- What does Islam say about discipline for children?
- How can I help my child's self-esteem?
- How do I deal with sibling rivalry?
- What mistakes do parents often make?
- What is a dua for good children?
