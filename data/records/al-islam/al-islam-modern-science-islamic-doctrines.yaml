description: An essay (about 3,500 words, labelled a Task Force Essay) on how modern science relates to
  Islamic teachings. It argues that conflicts between science and religion mostly come from philosophical
  attachments rather than from science itself, and discusses life and spirit, creation of the universe
  and whether the universe has a purpose.
