description: A chapter of Understanding the Month of Glory that gives a supplication (dua) attributed to Imam Sajjad as he welcomes the month of Ramadhan. In it he asks for help to honour the month, to fast with restraint, to pray on time, to care for relatives and neighbours, to give charity and to be forgiven.
