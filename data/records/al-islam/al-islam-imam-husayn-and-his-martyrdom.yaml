description: A long article by Abdullah Yusuf Ali, first given as an address (its preface says London, 1931), on the martyrdom of Imam Husayn at Karbala on the tenth of Muharram. It describes the places and journey that led to Karbala and the events there, and ends with lessons from the tragedy. The site says the text is presented to foster Islamic unity and brotherly love.
