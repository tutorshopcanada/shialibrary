description: A book that the site says was written for the youth about what Imamate (divinely guided leadership
  after the Prophet) means and the status of the Imams. It covers the characteristics of an Imam, the
  Ahl al-Bayt in the Quran and traditions, arguments for Imamate, and short biographies of the twelve
  Imams.
