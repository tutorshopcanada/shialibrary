description: Sūrat al-Kahf is sūrah number 18 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, except verse 28, and it has 110 verses. Its name means 'The Cave', after
  the story of the People of the Cave. It also covers the story of Prophet Musa and Khidr, and the story
  of Dhul-Qarnayn. The page also lists merits of reciting it.
