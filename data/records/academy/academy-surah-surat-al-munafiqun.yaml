description: Sūrat al-Munāfiqūn is sūrah number 63 of the Quran, a chapter of the Holy Book. The page
  says it was revealed in Madinah, and it has 11 verses. Its name means 'The Hypocrites'. It describes
  the signs of hypocrites in attitude and speech, warns believers to be careful of them, and reminds believers
  not to be misled by worldly pleasures. The page also lists merits of reciting it.
