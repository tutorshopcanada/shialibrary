description: Sūrat al-Shūrā is sūrah number 42 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 53 verses. Its name means 'The Consultation'. Its main theme is
  revelation, and it also covers signs of God in creation, the Day of Judgment, and the noble qualities
  of believers. The page also lists merits of reciting it.
