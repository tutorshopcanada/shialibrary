description: Sūrat al-Dahr is chapter 76 of the Quran (a sūrah), revealed in Madīnah and containing 31
  verses. It covers the creation of human beings, the rewards of the righteous, and an account the page
  gives of the Ahl al-Bayt feeding the needy, an orphan and a prisoner. The page also lists merits of
  reciting it.
