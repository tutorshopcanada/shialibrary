description: Sūrat al-Qamar is sūrah number 54 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in the early Makkan period, and it has 55 verses. Its name means 'The Moon', from the
  mention of the splitting of the moon in its first verse. It covers the Day of Judgment and the accounts
  of earlier peoples such as the people of Nuh, 'Ad, Thamud and Lut. The page also lists merits of reciting
  it.
