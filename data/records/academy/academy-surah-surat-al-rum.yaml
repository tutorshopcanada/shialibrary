description: Sūrat al-Rūm is sūrah number 30 of the Quran, a chapter of the Holy Book. The page says it
  was revealed in Makkah, and it has 60 verses. Its name means 'The Romans'. It predicts a victory of
  the Romans, questions the mindset of those who reject faith, and covers the signs of God, the Day of
  Judgment, and the nature of human beings. The page also lists merits of reciting it.
