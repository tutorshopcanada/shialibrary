description: Sūrat al-Jumu‘ah is sūrah number 62 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 11 verses. Its name means 'The Friday'. It begins by glorifying
  God, discusses the roles of the Prophet, and explains the importance of the Friday prayer. The page
  also lists merits of reciting it.
