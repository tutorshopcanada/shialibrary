description: Sūrat al-Dukhan is sūrah number 44 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 59 verses. It takes its name from the smoke (dukhan) mentioned
  in its opening verses. It covers the night the Quran was revealed, the story of Prophet Musa and Pharaoh,
  and the Day of Judgment. The page also lists merits of reciting it.
