description: Sūrat al-Qasas is sūrah number 28 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 88 verses. Its name means 'The Stories'. It tells the story of
  Prophet Musa from his birth to his years in Madyan, and it was revealed at a time when the early Muslims
  faced great pressure. The page also lists merits of reciting it.
