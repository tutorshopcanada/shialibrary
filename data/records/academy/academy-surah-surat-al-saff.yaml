description: Sūrat al-Saff is sūrah number 61 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 14 verses. Its name means 'The Ranks'. It covers the need for
  harmony between speech and action, the importance of unity, the opposition faced by Prophets Musa and
  Isa, and an invitation to a trade that brings reward. The page also lists merits of reciting it.
