description: Sūrat al-Fātir is sūrah number 35 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 45 verses. It is also known as Sūrat al-Malā'ikah (the Angels)
  because of its first verse. It covers the signs of God as Creator and Provider, the role of prophethood,
  and the rewards and punishments of the Hereafter. The page also lists merits of reciting it.
