description: Sūrat al-Shu‘arā’ is sūrah number 26 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, except its last four verses, and it has 227 verses. It takes its name from
  verse 224, which mentions the poets. It covers signs of God, the story of Prophet Musa and Pharaoh,
  and the challenges faced by several earlier prophets and their peoples. The page also lists merits of
  reciting it.
