description: Sūrat Hūd is sūrah number 11 of the Quran, a chapter of the Holy Book. The page says it was
  revealed in Makkah, and it has 123 verses. It takes its name from Prophet Hud. It was revealed in the
  last years of the Prophet's time in Makkah, and it covers the call to monotheism, the stories of earlier
  prophets including Nuh, Salih, Lut, Shu'ayb and Musa, and advice on steadfastness. The page also lists
  merits of reciting it.
