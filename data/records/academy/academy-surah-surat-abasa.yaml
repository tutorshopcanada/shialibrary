description: Sūrat ‘Abasa is chapter 80 of the Quran (a sūrah), revealed in Makkah and containing 42 verses.
  It covers a rebuke to a man who turned away from a blind companion of the Prophet, the value of the
  Quran, God's blessings, and the Day of Judgment. The page also lists merits of reciting it.
