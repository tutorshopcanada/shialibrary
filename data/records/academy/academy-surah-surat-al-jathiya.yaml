description: Sūrat al-Jāthiya is sūrah number 45 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 37 verses. It takes its name from verse 28, which describes people
  kneeling on the Day of Judgment. It covers the greatness of the Quran, signs of God, past peoples, and
  the awe-inspiring events of the Day of Judgment. The page also lists merits of reciting it.
