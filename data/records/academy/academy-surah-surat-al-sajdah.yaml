description: Sūrat al-Sajdah is sūrah number 32 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 30 verses. Also known as Alif Lam Mim Sajdah, to tell it apart
  from Sūrat Ḥā Mīm Sajdah, it takes its name from the prostration mentioned in it. It covers the greatness
  of the Quran, signs of God on earth and in the sky, the creation of humans, and death and resurrection.
  The page also lists merits of reciting it.
