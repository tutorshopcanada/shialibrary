description: Sūrat al-Mulk is sūrah number 67 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 30 verses. It is also known as al-Māni' (the Shield) and al-Munjiyah
  (the Savior). It covers God's creation and power, the Hereafter and the recompense for deeds, and warnings.
  The page also lists merits of reciting it.
