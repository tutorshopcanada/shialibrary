description: Sūrat Sād is sūrah number 38 of the Quran, a chapter of the Holy Book. The page says it was
  revealed in Makkah, and it has 88 verses. It is named after the letter Sad that opens it. It covers
  the opposition of the polytheists to Tawhid and prophethood, and the lives of nine prophets, with Dawud,
  Sulayman and Ayyub discussed in more detail. The page also lists merits of reciting it.
