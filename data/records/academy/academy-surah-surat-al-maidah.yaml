description: Sūrat al-Mā’idah is chapter 5 of the Quran (a sūrah), revealed in Madīnah and containing
  120 verses. It covers laws on pilgrimage, food, hunting and purity, justice and keeping promises, relations
  with the People of the Book, and the matter of leadership after the Prophet, which the page lists among
  its topics. The page also lists merits of reciting it.
