description: Sūrat al-Mujādilah is sūrah number 58 of the Quran, a chapter of the Holy Book. The page
  says it was revealed in Madinah, and it has 22 verses. It takes its name from the first verse, which
  tells of a woman who pleaded with the Prophet about her husband's divorce-like pre-Islamic practice.
  It covers that practice, rules of etiquette in gatherings, and the qualities of hypocrites. The page
  also lists merits of reciting it.
