description: Sūrat Qāf is sūrah number 50 of the Quran, a chapter of the Holy Book. The page says it was
  revealed in Makkah, and it has 45 verses. It is named after the letter Qaf that opens it. It deals almost
  entirely with resurrection and the Hereafter, with proofs drawn from nature and history. The page also
  lists merits of reciting it.
