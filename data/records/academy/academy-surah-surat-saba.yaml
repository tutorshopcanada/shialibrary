description: Sūrat Saba is sūrah number 34 of the Quran, a chapter of the Holy Book. The page says it
  was revealed in Makkah, and it has 54 verses. It is named after the people of Saba' mentioned in it.
  It begins with praise of God's authority in this world and the Hereafter, and covers the Day of Judgment
  and the stories of Prophets Dawud and Sulayman. The page also lists merits of reciting it.
