description: Sūrat al-Furqān is sūrah number 25 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 77 verses. Its name means 'The Criterion', and it answers objections
  raised by those who rejected the Prophet, shows signs of God's greatness, and describes the qualities
  of the servants of the Most Merciful. The page also lists merits of reciting it.
