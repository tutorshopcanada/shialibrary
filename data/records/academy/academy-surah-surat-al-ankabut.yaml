description: Sūrat al-Ankabūt is sūrah number 29 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 69 verses. Its name means 'The Spider', and it discusses the testing
  of believers, stories of earlier prophets, and belief in the Quran. The page also lists merits of reciting
  it.
