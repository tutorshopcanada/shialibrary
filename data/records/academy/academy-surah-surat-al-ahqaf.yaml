description: Sūrat al-Ahqāf is sūrah number 46 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 35 verses. It takes its name from the sandy plains of the people
  of 'Ad mentioned in verse 21, and it covers the greatness of the Quran, the Hereafter, the duty to honour
  parents, and the story of the people of 'Ad. The page also lists merits of reciting it.
