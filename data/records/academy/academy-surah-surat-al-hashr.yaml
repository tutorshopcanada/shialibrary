description: Sūrat al-Hashr is sūrah number 59 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 24 verses. It takes its name from the banishment of the Banu
  Nadir mentioned in verse 2. It covers the community of Madinah, the hypocrites, general advice, and
  the beautiful names of God. The page also lists merits of reciting it.
