description: Sūrat al-Tahrim is sūrah number 66 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 12 verses. It takes its name from the first verse, which refers
  to the Prophet making something lawful unlawful for himself. It covers that event, warnings to the Prophet's
  wives, a call to believers, and examples of righteous and unrighteous women. The page also lists merits
  of reciting it.
