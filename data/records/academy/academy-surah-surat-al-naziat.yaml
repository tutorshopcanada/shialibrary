description: Sūrat al-Nazi‘āt is chapter 79 of the Quran (a sūrah), revealed in Makkah and containing
  46 verses. It covers oaths on the certainty of the Last Day, the story of Musa and Pharaoh, and signs
  of God's power in nature. The page also lists merits of reciting it.
