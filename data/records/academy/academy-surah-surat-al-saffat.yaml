description: Sūrat al-Sāffāt is sūrah number 37 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 182 verses. Its name means 'Those Who Stand in Ranks', after the
  angels in its opening verses. It covers the principles of Tawhid and the Hereafter, the fate of the
  devils, the conversations of those who rejected faith on the Day of Judgment, and the stories of several
  prophets. The page also lists merits of reciting it.
