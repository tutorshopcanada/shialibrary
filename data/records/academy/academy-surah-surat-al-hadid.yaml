description: Sūrat al-Hadīd is sūrah number 57 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 29 verses. Its name means 'Iron'. It is one of the five sūrahs
  that begin by glorifying God, and it covers the qualities of God, belief in the messengers and the books,
  and giving in the way of God. The page also lists merits of reciting it.
