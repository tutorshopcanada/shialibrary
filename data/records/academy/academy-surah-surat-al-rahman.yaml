description: Sūrat al-Rahmān is sūrah number 55 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 78 verses. It takes its name from the Most Merciful, the first
  name of God in it. It focuses on the spiritual and material blessings of God, with the refrain 'So which
  of your Lord's bounties will you both deny?' repeated throughout. The page also lists merits of reciting
  it.
