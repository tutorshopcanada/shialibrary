description: Sūrat al-Ahzāb is sūrah number 33 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 73 verses. It takes its name from the Battle of the Confederates
  (Ahzab), and it also covers the status of the Prophet, the Prophet's wives, and the value of modesty
  in society. The page also lists merits of reciting it.
