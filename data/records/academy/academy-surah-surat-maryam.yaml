description: Sūrat Maryam is sūrah number 19 of the Quran, a chapter of the Holy Book. The page does not
  state where it was revealed, and it has 98 verses. It is named after Lady Maryam (Mary), whose story
  is told in detail in it, and it covers the stories of Prophets Zakariyya, Yahya, Isa, Ibrahim and Musa.
  The page also lists merits of reciting it.
