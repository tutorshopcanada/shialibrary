description: Sūrat Yāsīn is sūrah number 36 of the Quran, a chapter of the Holy Book. The page says it
  was revealed in Makkah, and it has 83 verses. It is one of the most often discussed sūrahs in Islamic
  tradition. It covers the mission and warnings of the Prophet, the story of three messengers who called
  people to the One God, and signs of God on earth. The page also lists merits of reciting it.
