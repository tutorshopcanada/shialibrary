description: Sūrat al-Qalam is sūrah number 68 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in the early Makkan period, and it has 52 verses. Its name means 'The Pen', from its
  opening oath. It covers the outstanding character of the Prophet, the traits of those who rejected faith,
  the parable of the owners of the garden, and the Day of Judgment. The page also lists merits of reciting
  it.
