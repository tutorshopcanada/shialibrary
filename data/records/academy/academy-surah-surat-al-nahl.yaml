description: Sūrat al-Nahl is sūrah number 16 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, with some verses revealed in Madinah, and it has 128 verses. It takes its
  name from the bee mentioned in verses 68 and 69. It covers the many blessings God has given to humans,
  proofs of the Oneness of God and of the Hereafter, and arguments of the polytheists. The page also lists
  merits of reciting it.
