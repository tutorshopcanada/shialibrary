description: Sūrat Ibrāhīm is sūrah number 14 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, except verses 28 and 29, which were revealed in Madinah, and it has 52 verses.
  It takes its name from Prophet Ibrahim, the father of the monotheistic faiths, and it includes many
  of his supplications. It covers lessons from earlier prophets, gratitude, patience and trust in God,
  and the regret of the disbelievers in the Hereafter. The page also lists merits of reciting it.
