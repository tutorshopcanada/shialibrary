description: Sūrat al-Naml is sūrah number 27 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 93 verses. It takes its name from the valley of the ants mentioned
  in it. A significant part tells the story of Prophet Sulayman, and it also covers the stories of Musa,
  Salih and Lut. The page also lists merits of reciting it.
