description: Sūrat al-Fussilat is sūrah number 41 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 54 verses. Also known as Ḥā Mīm Sajdah, it takes its name from
  the description of the Quran in verse 3 as a book whose signs are explained in detail. It covers the
  nature of the Quran, the creation of the heavens and the earth, and warnings about the Day of Judgment.
  The page also lists merits of reciting it.
