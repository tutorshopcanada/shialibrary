description: Sūrat al-Zukhruf is sūrah number 43 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 89 verses. It takes its name from the gold ornaments (zukhruf)
  mentioned in verse 35. It covers the importance of the Quran and prophethood, signs of Tawhid, the rejection
  of polytheism and false beliefs about angels, and stories of past prophets. The page also lists merits
  of reciting it.
