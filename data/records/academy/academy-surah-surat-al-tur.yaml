description: Sūrat al-Tur is sūrah number 52 of the Quran, a chapter of the Holy Book. The page says it
  was revealed in Makkah, and it has 49 verses. Its name means 'The Mount', and it begins with oaths before
  discussing the coming of the Day of Judgment and the rewards and punishments of the Hereafter. The page
  also lists merits of reciting it.
