description: Sūrat al-Nūr is sūrah number 24 of the Quran, a chapter of the Holy Book. The page says it
  was revealed in Madinah, and it has 64 verses. Its name means 'The Light', and it contains many rules
  on chastity and modesty. It covers the penalties for adultery and slander, the incident of slander against
  the Prophet's wife, moral conduct, and the verse about God as the Light of the heavens and the earth.
  The page also lists merits of reciting it.
