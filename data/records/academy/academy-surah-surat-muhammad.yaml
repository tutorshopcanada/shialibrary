description: Sūrat Muhammad is sūrah number 47 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 38 verses. It takes its name from verse 2, which mentions the
  Prophet by name, and it is also known as al-Qitāl (Fighting). It covers faith and disbelief, war and
  prisoners of war, the hypocrites, and lessons from earlier peoples. The page also lists merits of reciting
  it.
