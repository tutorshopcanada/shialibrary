description: Sūrat al-Baqarah is sūrah number 2 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 286 verses. It is the longest sūrah of the Quran and takes its
  name from the story of the cow in verses 67 to 73. It covers the qualities of believers and hypocrites,
  the stories of Prophets Musa and Ibrahim, and guidance for the community. The page also lists merits
  of reciting it.
