description: Sūrat al-Mu’minūn is sūrah number 23 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 118 verses. Its name means 'The Believers'. It describes the qualities
  of successful believers, signs of God in the universe, stories of some past prophets, and the Hereafter.
  The page also lists merits of reciting it.
