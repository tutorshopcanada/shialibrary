description: Sūrat al-Hajj is sūrah number 22 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 78 verses. It takes its name from the mention of Hajj in verse
  27. It covers the Day of Judgment, answers to the arguments of polytheists, the outcomes for the people
  of earlier prophets, and rules and virtues related to Hajj. The page also lists merits of reciting it.
