description: Sūrat al-An‘ām is chapter 6 of the Quran (a sūrah), revealed in Makkah and containing 165
  verses. It covers the qualities of God, the objections of those who rejected the Prophet and the answers
  to them, the argument of Prophet Ibrahim, and the mission of earlier prophets. The page also lists merits
  of reciting it.
