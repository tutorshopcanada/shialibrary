description: Sūrat al-A‘rāf is chapter 7 of the Quran (a sūrah), revealed in Makkah (with one verse said
  by some commentators to be Madinan) and containing 206 verses. It covers the creation of Adam and the
  story of Iblis, guidance for human beings, the groups of people in the Hereafter, and the people of
  al-A'raf. The page also lists merits of reciting it.
