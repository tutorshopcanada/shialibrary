description: Sūrat al-Mumtahanah is sūrah number 60 of the Quran, a chapter of the Holy Book. The page
  says it was revealed in Madinah, and it has 13 verses. It takes its name from verse 10, which refers
  to testing women who migrated. It covers love and dislike for the sake of God, and the limits on close
  friendship with those who oppose the faith. The page also lists merits of reciting it.
