description: Sūrat al-Taghābun is sūrah number 64 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 18 verses. Its name means 'The Mutual Loss and Gain', and it
  is the last of the five sūrahs that begin by glorifying God. It covers praise of God, lessons from the
  fate of past peoples, and the Day of Judgment. The page also lists merits of reciting it.
