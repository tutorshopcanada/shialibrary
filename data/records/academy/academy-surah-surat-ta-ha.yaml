description: Sūrat Ta-Ha is sūrah number 20 of the Quran, a chapter of the Holy Book. The page says it
  was revealed in Makkah, and it has 134 verses. It is named after its opening letters, and about 90 of
  its verses discuss the story of Prophet Musa, including his call, his mission and his encounter with
  Pharaoh's magicians. It also briefly mentions the greatness of the Quran. The page also lists merits
  of reciting it.
