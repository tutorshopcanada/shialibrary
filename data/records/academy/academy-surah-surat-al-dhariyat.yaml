description: Sūrat al-Dhāriyāt is sūrah number 51 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 60 verses. It takes its name from its first verse, which mentions
  winds that scatter. It discusses the Day of Judgment, signs of God in creation, and the visit of angels
  to Prophet Ibrahim. The page also lists merits of reciting it.
