description: Sūrat al-Wāqi ‘ah is sūrah number 56 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 96 verses. Its name means 'The Event', referring to the Day of
  Judgment. It covers the beginning of that Day, the division of people into three groups in the Hereafter,
  and the rewards of each. The page also lists merits of reciting it.
