description: Sūrat al-Naba’ is chapter 78 of the Quran (a sūrah), revealed in Makkah and containing 40
  verses. It covers questions about the Day of Judgment, examples from nature that point to resurrection,
  and the fate of believers and rejecters. The page also lists merits of reciting it.
