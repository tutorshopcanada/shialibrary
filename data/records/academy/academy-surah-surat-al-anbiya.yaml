description: Sūrat al-Anbiyā’ is sūrah number 21 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 112 verses. Its name means 'The Prophets', and it tells the stories
  of many prophets, their hardships, and their call to belief in one God and in the Hereafter. The page
  also lists merits of reciting it.
