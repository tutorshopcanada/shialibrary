description: Sūrat al-Isrā is sūrah number 17 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 111 verses. It takes its name from the Night Journey of the Prophet
  mentioned in its first verse. It is also known as Banu Isra'il, and it covers the Prophet's Ascension,
  stories of the Children of Israel, free will, and the rights of relatives and others. The page also
  lists merits of reciting it.
