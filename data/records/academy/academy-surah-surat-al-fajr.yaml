description: Sūrat al-Fajr is chapter 89 of the Quran (a sūrah), revealed in Makkah and containing 30
  verses. It covers oaths on the truth of the message, past peoples who rejected God, the trials human
  beings face, and deeds that distance a person from God. The page also lists merits of reciting it.
