description: Sūrat Luqmān is sūrah number 31 of the Quran, a chapter of the Holy Book. The page says it
  was revealed in Makkah, and it has 34 verses. It is named after Luqman, whose advice to his son is recorded
  in it. It covers the Quran as guidance, signs of God in nature, and the Day of Judgment. The page also
  lists merits of reciting it.
