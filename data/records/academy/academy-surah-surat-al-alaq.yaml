description: Sūrat al-‘Alaq is chapter 96 of the Quran (a sūrah), revealed in Makkah and containing 19
  verses. It covers the first commands to read and learn, the rebellion of human beings, and the command
  to prostrate, which commentators regard as among the earliest revelations. The page also lists merits
  of reciting it.
