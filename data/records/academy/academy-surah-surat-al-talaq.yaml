description: Sūrat al-Talāq is sūrah number 65 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 12 verses. Its name means 'The Divorce', because most of it discusses
  the laws of divorce. It is also known as Sūrat al-Nisā' al-Sughrā (the Small Sūrat al-Nisā'). The page
  also lists merits of reciting it.
