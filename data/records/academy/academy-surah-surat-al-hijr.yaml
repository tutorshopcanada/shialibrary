description: Sūrat al-Hijr is sūrah number 15 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 99 verses. It takes its name from al-Hijr, the land of the people
  of Prophet Salih. It covers the reaction of the disbelievers to the Quran, signs of God in creation,
  the story of Iblis, and the stories of past prophets. The page also lists merits of reciting it.
