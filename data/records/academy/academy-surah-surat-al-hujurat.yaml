description: Sūrat al-Hujurāt is sūrah number 49 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 18 verses. Its name means 'The Chambers'. It sets out manners
  toward the Prophet and rules for good social relations, and it explains the meaning of true faith. The
  page also lists merits of reciting it.
