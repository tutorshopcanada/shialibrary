description: Sūrat al-Ghāfir is sūrah number 40 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Madinah, and it has 85 verses. Also known as Sūrat al-Mu'min, it is named after the
  believing man of Pharaoh's family whose story appears in it. It covers the beautiful names of God, warnings
  to those who reject faith, and signs of the existence of the One God. The page also lists merits of
  reciting it.
