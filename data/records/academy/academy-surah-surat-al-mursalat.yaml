description: Sūrat al-Mursalāt is chapter 77 of the Quran (a sūrah), revealed in Makkah and containing
  50 verses. It covers oaths and reminders of the Day of Judgment, the fate of past peoples, the creation
  of human beings, and God's blessings on earth. The page also lists merits of reciting it.
