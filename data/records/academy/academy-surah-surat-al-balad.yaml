description: Sūrat al-Balad is chapter 90 of the Quran (a sūrah), revealed in Makkah and containing 20
  verses. It covers oaths about the hardships of human life, God's control over all things, the blessings
  given to human beings, and the value of selfless acts. The page also lists merits of reciting it.
