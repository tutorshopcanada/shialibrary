description: Sūrat al-Zumar is sūrah number 39 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 75 verses. Its name means 'The Groups'. Its main theme is devout
  and sincere worship of God, and it sets out teachings revealed in Makkah that formed the basis of the
  faith and practice of the Muslims in Madinah. The page also lists merits of reciting it.
