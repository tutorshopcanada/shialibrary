description: Sūrat al-Najm is sūrah number 53 of the Quran, a chapter of the Holy Book. The page says
  it was revealed in Makkah, and it has 62 verses. Its name means 'The Star'. It covers the nature of
  revelation, the event of Mi'raj (the Ascension), the misguided worship of the polytheists, and signs
  of God. The page also lists merits of reciting it.
