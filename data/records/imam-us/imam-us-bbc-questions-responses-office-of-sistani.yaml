description: A public statement, posted in October 2019, in which the office of Sayyid Ali al-Sistani
  answers questions from the BBC about certain marriage-related practices and the conduct of some people
  who claim to follow him. It sets out the office's condemnation of exploitative practices and calls on
  official authorities to act. It is for readers who want to know how the office responded to these allegations.
sample_questions:
- How did Sayyid al-Sistani's office respond to the BBC?
- What is the Sistani office's position on exploitation in marriage?
- Did Sayyid al-Sistani condemn these practices?
- What does Islam say about the dignity of women?
- How do Shia authorities respond to allegations against people who claim to follow them?
