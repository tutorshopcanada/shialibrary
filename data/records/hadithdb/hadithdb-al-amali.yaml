description: 'This page holds two books of recorded teaching sessions (called amali, or dictations) under
  one name: one by Shaykh al-Saduq and one by Shaykh al-Mufid. Each session moves between ethics, the
  lives of the Prophet and the Imams and points of belief, and several relate to Karbala. Shown in Arabic
  with English translation; a primary source for readers with some background.'
