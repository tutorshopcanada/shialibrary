description: A treatise on rights attributed to Imam Zayn al-Abidin, preserved by Shaykh al-Saduq. It
  lists around fifty rights one owes, starting with the rights of God and one's own body and moving outward
  to teachers, family and neighbours. Shown in Arabic with English translation; shorter than most collections,
  so a good starting point.
