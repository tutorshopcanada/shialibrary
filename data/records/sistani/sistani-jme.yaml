description: A simplified guide to everyday Islamic rulings (fiqh) written for ordinary readers, following
  the views of Sayyid Ali al-Sistani. It is set out as conversations between a father and his teenage
  son on topics such as prayer, fasting, Hajj, khums (a religious payment), trade, marriage and inheritance.
