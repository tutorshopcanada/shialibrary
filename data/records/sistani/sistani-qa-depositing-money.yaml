description: A topic page of questions and answers about depositing money in banks. Questions cover salaries
  paid directly into a bank account and whether khums (a religious payment on savings) applies to it,
  depositing money in national banks, and depositing in non-Muslim banks with the intention of gaining
  interest.
sample_questions:
- Can I keep my money in a bank?
- Do I pay khums on my bank balance?
- Can I deposit money in a non-Muslim bank?
- Can I earn interest on my savings?
- Is a salary paid into the bank subject to khums?
