description: A topic page of questions and answers about burying a deceased Muslim, mostly for Muslims
  living in non-Muslim countries. Questions cover burial in non-Muslim cemeteries, moving the body to
  a Muslim country, who pays the costs, who takes charge when there is no heir, and burial in a coffin.
sample_questions:
- Can a Muslim be buried in a non-Muslim cemetery?
- Should a body be sent to a Muslim country?
- Who pays for transporting a body?
- Can a Muslim be buried in a coffin?
- Who arranges burial if there is no family?
