  is determined, whether sighting in one city suffices for another, and what counts as evidence.
sample_questions:
- How do I know when Ramadan starts?
- Does the moon sighting in one city count for another?
- How do I know a new month has started?
- What counts as evidence of the new moon?
- Can we use astronomy to find the start of the month?
