description: A plain-language book on the religious rules that apply to women around menstruation (hayd),
  irregular bleeding (istihada), postnatal bleeding (nifas), ghusl (a full ritual wash) and tayammum (dry
  ablution), following Sayyid Sistani's rulings. It is written as conversations between a mother and her
  teenage daughter.
