description: A concise treatise on the main rulings (fiqh) of worship, prepared by the office of Sayyid
  Ali al-Sistani in line with his fatwas. It covers prayer, fasting, Hajj, zakat and khums (religious
  payments), with selected rulings on purity, taqlid (following a jurist) and enjoining good and forbidding
  evil.
