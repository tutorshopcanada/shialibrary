description: Covers being in a state of janabah (major ritual impurity needing a full ritual wash, ghusl),
  haydh (menstruation) or nifas (post-childbirth bleeding) around dawn during Ramadan and other fasts.
  Includes cases of forgetting, sleep, wet dreams, and lack of time to wash.
sample_questions:
- Can I fast if I am in a state of janabah at dawn?
- What if I forget to do ghusl before dawn in Ramadan?
- What if I sleep while in janabah during Ramadan?
- What about a wet dream while sleeping at night?
- What if I do not have time for ghusl before dawn?
- How does this apply to make-up fasts?
