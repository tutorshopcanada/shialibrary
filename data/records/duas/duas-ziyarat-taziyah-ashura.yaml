description: "A salutation of condolence (taziyah) that the page says is recited in the last hours of the Day of Ashura. It offers condolences to the Prophet, Imam Ali, Lady Fatimah, Imam al-Hasan and the Imams from the descendants of Imam al-Husayn, and gives the text in Arabic, transliteration and translation."
