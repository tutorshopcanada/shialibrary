description: Part 2 of a course on the life of Imam Ridha (as), the eighth Imam. It covers the last two years of his life, after he was made to leave Madinah and settle in Marw, the capital of the Abbasid caliphate. Topics include the offer of the caliphate, his conditions for accepting it, his teaching, and his martyrdom.
