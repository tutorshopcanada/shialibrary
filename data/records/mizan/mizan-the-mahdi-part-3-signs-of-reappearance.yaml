description: A six-hour in-person course, Part 3 of a series on the Mahdi, on the signs of his reappearance. It covers the definite and non-definite signs, asks which lands the signs will affect, and considers whether some signs should be read as metaphors.
sample_questions:
- What are the signs of the reappearance of the Mahdi?
- Are the signs of the Mahdi literal or metaphorical?
- Which lands will the signs of the Mahdi affect?
- What is the difference between the signs of Judgment Day and the signs of the Mahdi?
