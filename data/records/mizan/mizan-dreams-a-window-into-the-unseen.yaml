description: The full Dreams presentation, which looks at dreams in Islamic teaching. It covers where dreams appear in the Quran, the types of dreams, the difficulty of interpreting them, whether dreams can be signs from God, and the dreams Imam Husayn (as) saw on his journey to Karbala.
