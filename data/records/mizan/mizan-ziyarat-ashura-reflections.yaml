description: Reflections by Shaykh Amin Rastani on Ziyarat Ashura, a ziyarat from Imam Baqir (as) that is recited on the tenth of Muharram and throughout the year. The talk covers the imamate, history, duas, la'n (cursing) and baraa'ah (disassociation), and a point on the Mahdi.
