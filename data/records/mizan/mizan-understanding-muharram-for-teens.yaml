description: A course that answers ten common questions teens ask about Muharram. The questions include why Imam Husayn took a stance at Karbala, why Muharram is commemorated each year, and how to explain it to Sunni and non-Muslim friends.
sample_questions:
- Why do we commemorate Muharram every year?
- Why did Imam Husayn take a stand at Karbala?
- Is matam (chest beating) part of Islam?
- How do I explain Muharram to my friends?
- Why are there different stories about Karbala?
