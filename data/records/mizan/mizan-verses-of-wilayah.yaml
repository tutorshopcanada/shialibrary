description: A 2.5 hour presentation that compares how Shia and Sunni scholars read four Quranic verses discussed in relation to wilayah (guardianship or authority), including the verse of wilayah (5:55). It sets out the views of named scholars on each side, such as Allamah Tabatabai and Fakhr al-Razi.
sample_questions:
- Which Quran verses are linked to wilayah?
- What is the verse of wilayah?
- How do Shia and Sunni scholars understand these verses?
- Are these verses clear or ambiguous?
- What objections did Fakhr al-Razi raise about the verse of wilayah?
