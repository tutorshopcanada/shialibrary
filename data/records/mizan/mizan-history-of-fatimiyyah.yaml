description: A ten-lesson course on the life and history of Lady Fatimah (as). It begins with what the historical sources say about her and goes through the events after the Prophet's death, including the Fadak case and the lessons on her burial and her final will, then the Shi'i sources on her martyrdom and five narrations from her.
sample_questions:
- Who was Lady Fatimah?
- What happened to Fadak?
- What do the sources say about Lady Fatimah?
- How did Lady Fatimah die?
- What narrations are reported from Lady Fatimah?
- What is the story of the Saqifah?
