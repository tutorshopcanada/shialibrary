description: An in-person course on death and barzakh (the realm between death and the Day of Resurrection). It is based on the works of Allamah Tabatabai, including his book al-Insan and his Quranic commentary al-Mizan, and aims at understanding the essence of these stages. The page describes it as part 1 of a series.
