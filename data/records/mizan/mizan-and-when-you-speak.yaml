description: A course that examines Quranic strategies for effective, honest and meaningful conversations about sensitive social, political and religious issues. It covers the basic principles of Quranic conversation, how to set the tone for a discussion, where such efforts can be focused, and how social media can be used.
sample_questions:
- How should Muslims talk about sensitive issues?
- What does the Quran teach about good conversation?
- How can I set the tone for a productive discussion?
- How can social media be used for meaningful exchange?
