description: A two-part course for teens aged 11 to 16 that walks through the journey of Imam Husayn’s caravan in an organized way. It covers why he started his movement, his farewell in Madinah, his time in Makkah, the journey to Karbala and his encounter with Hurr. Part 2 addresses the 10th of Muharram and the events after Karbala.
