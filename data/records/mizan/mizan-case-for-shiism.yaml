description: A free presentation that analyses Hadith al-Thaqalayn (the hadith of the two weighty things) and narrations about twelve successors of the Prophet. The page describes the hadith as central to the Shia-Sunni debate and lists questions it answers, such as who the Ahlul Bayt are.
sample_questions:
- What is Hadith al-Thaqalayn?
- Who are the Ahlul Bayt?
- What are the narrations about the twelve khalifahs?
- Is Imamah one of the usul al-din?
- What are the Sunni interpretations of these narrations?
