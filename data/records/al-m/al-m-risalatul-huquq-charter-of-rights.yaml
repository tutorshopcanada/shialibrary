description: The fourth edition of a book on the treatise on rights by Imam Zayn al-Abidin, covering the
  rights of God, the self, dependents, society and more. It combines Allamah Saeed Akhtar Rizvi's translation
  and fifty headings with a commentary on each right by Sayyid Muhammad Rizvi. For readers who want to
  learn what Islam says people owe each other.
