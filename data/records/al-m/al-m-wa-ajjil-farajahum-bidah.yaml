description: A short article on whether adding 'wa ajjil farajahum' (a request for the Imams' relief)
  after sending blessings on the Prophet and his family counts as an innovation (bid'ah). The author,
  Sayyid Muhammad Rizvi, argues that it does not, and points to early Shia sources that contain the phrase.
  Written for readers who have heard the practice questioned.
