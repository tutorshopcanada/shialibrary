# Authority file: one entry per scholar or author, with every name spelling verified
# on an approved source. Records refer to these ids in `authors`, `instructors`, `marja`.
# Arabic/Persian forms are added to alt_names only when verified from an approved page.
scholars:
  - id: sistani
    name: "Sayyid Ali al-Sistani"
    role: marja
    alt_names:
      - "Sistani"
      - "al-Sistani"
      - "Sayyid Ali Sistani"
      - "Ayatollah Sistani"
      - "al-Sayyid al-Sistani"
      - "as-Sayyid 'Ali al-Hussaini as-Seestani"
      - "Seestani"
      - "Ayatullah Sistani"
    notes: "Spellings as they appear on sistani.org English pages and in CLAUDE.md."
    needs_review: true

  - id: khamenei
    name: "Sayyid Ali Khamenei"
    role: marja
    alt_names:
      - "Khamenei"
      - "Khamene'i"
      - "Seyyed Ali Khamenei"
      - "Ayatollah Khamenei"
      - "Imam Khamenei"
    notes: >
      Starter spellings from the project brief. No approved source for his rulings has been
      named yet, so none of these are verified against a page. Re-check when a source is added.
    needs_review: true

  - id: abdul-hadi-al-hakim
    name: "Sayyid Abdul Hadi al-Hakim"
    role: author
    alt_names:
      - "as-Sayyid Abdul Hadi al-Hakim"
      - "Sayyid 'Abdul Hadi al-Hakim"
      - "Hujjatul Islam Sayyid 'Abdul Hadi al-Hakim"
    notes: >
      Named as the author of "A Code of Practice For Muslims in the West" (al-Fiqh lil
      Mughtaribin) in the book's Editor's Note and Translator's Preface on sistani.org
      (book/46/2019, book/46/2020). The book presents the rulings of Sayyid Sistani.
    needs_review: true

