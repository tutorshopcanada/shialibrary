# Approved sources. Nothing is cataloged unless it is listed here with status: active.
# Only the owner adds sources. Proposals go in proposals/new-sources.md.
# status: active (may be cataloged) | blocked (approved, but the site refuses automated
#         access; do not fetch until the owner resolves it) | backlog (waiting on the owner)
sources:
  - id: thaqalayn.net
    name: "Thaqalayn"
    type: hadith-collections
    base_url: "https://thaqalayn.net/"
    status: active
    catalog_level: "One record per collection/book/volume. No per-hadith records."
    notes: >
      thaqalayn.net permanently redirects to thaqalayn.com (checked 2026-11-10); record URLs
      use the address the site actually serves. robots.txt allows everything except /api/
      and /super/, and publishes a sitemap.

  - id: al-islam.org
    name: "Al-Islam.org (Ahlul Bayt Digital Islamic Library Project)"
    type: library
    base_url: "https://al-islam.org/"
    status: active
    crawl_delay_seconds: 10
    catalog_level: "One record per book or article. Beginner material first."
    notes: >
      robots.txt (read 2026-11-10) allows book and article pages, disallows /search/, /admin/,
      /user/ and similar, and asks for a 10-second delay between requests. Plain scripted
      requests (curl) from the build machine are refused by the site's Cloudflare protection,
      so pages are read one at a time with the standard web-fetch tool, never faster than the
      crawl delay, and candidate pages are found through a web search limited to this site
      (the site's own /search/ is off limits). Do not use /book/export/ or /printpdf/ URLs
      as record URLs; use the book's normal page.

  - id: sistani.org
    name: "Office of Sayyid Ali al-Sistani"
    type: fiqh
    base_url: "https://www.sistani.org/english/"
    status: active
    catalog_level: "Work, section (one page), and item (single Q&A with its own URL)."
    notes: >
      robots.txt has no disallow rules (checked 2026-11-10). Structure report:
      docs/sistani-structure.md. Every record from this source is content_tag fiqh.

  - id: khamenei.ir
    name: "Office of Sayyid Ali Khamenei"
    type: fiqh
    base_url: "https://khamenei.ir/"
    status: blocked
    catalog_level: "To be decided after the site's structure is inspected."
    notes: >
      Named by the owner on 2026-11-10 as the likely source for Sayyid Khamenei's rulings
      ("should work maybe"). Not reachable from the build machine on 2026-11-10: direct
      requests to khamenei.ir and english.khamenei.ir were reset, and the web-fetch tool got
      HTTP 503 for robots.txt on both. Nothing has been inspected or cataloged. Before any
      cataloging: read robots.txt, inspect and report the structure (which section holds the
      English rulings, URL patterns, per-question links), and confirm with the owner.

  - id: duas.org
    name: "Duas.org"
    type: duas
    base_url: "https://www.duas.org/"
    status: active
    catalog_level: "To be decided after the site's structure is inspected (suggested: one record per dua or ziyarat page)."
    notes: >
      Approved by the owner on 2026-11-12. Reachable by plain requests (checked 2026-11-12);
      /robots.txt returns 404 (no rules) and there is no sitemap.xml, so pages must be found by
      following links from the home page. The home page is mostly an index of static .htm pages.
      Structure not inspected yet: before cataloging, read the main sections, report the URL
      patterns and what content type tags fit (not fiqh; use headings under duas-ziyarat).

  - id: imam-us.org
    name: "Imam Mahdi Association of Marjaeya (I.M.A.M.)"
    type: library
    base_url: "https://imam-us.org/"
    status: active
    catalog_level: "One record per article, book or video page. Fiqh pages only if they present Sistani's or Khamenei's rulings; the site's own marja is not recorded here, so fiqh pages are skipped and logged until the owner says whose rulings it presents."
    notes: >
      Supplied by the owner on 2026-11-12. WordPress site. robots.txt (read 2026-11-12) only
      blocks /wp-admin and invoice uploads; no crawl delay. Sections include announcements and
      news (out of scope), articles, books, video, and fiqh categories ("everyday-fiqh",
      "from-the-marja", "what-should-i-do"). The home page also lists /arabic and /farsi
      (other languages: skip). Be polite: one request every 2 seconds at most.

  - id: almizan.org
    name: "Tafsir al-Mizan in English (almizan.org)"
    type: library
    base_url: "https://almizan.org/"
    status: blocked
    catalog_level: "To be decided after inspection (suggested: the commentary as a work, one section per surah or chapter page, plus its reader guides)."
    notes: >
      Supplied by the owner on 2026-11-12 (marked "new"). English Quran commentary of
      Allamah Tabatabai. robots.txt (read 2026-11-12) has comments about content signals but no
      Disallow or signal rules; a sitemap exists at /sitemap.xml. The owner has not said how this
      relates to the "Academy for Learning Islam (ALI)" institute; it is treated as a library
      source, not an institute. Be polite: one request every 2 seconds at most.
      BLOCKED 2026-11-12: the site's copyright page (https://almizan.org/copyright/) says that without
      prior written permission nobody may copy, download or extract the commentary by hand or by
      automated means (scraping, crawling, bulk downloading), or use it to build databases or AI
      models. Nothing has been cataloged. Needs the owner to get written permission from the site's
      publisher (contact form on the copyright page) or to decide on a manual approach. Structure
      notes: docs/almizan-structure.md.

  - id: mizaninstitute.org
    name: "Mizan Institute"
    type: courses
    base_url: "https://mizaninstitute.org/"
    status: active
    crawl_delay_seconds: 10
    catalog_level: "One record per course (type course, content_tag course, provider Mizan Institute). Not per lesson."
    notes: >
      Supplied by the owner on 2026-11-12; see the institutes list below. Fiqh-subject courses are
      skipped and logged. Sitemap: https://mizaninstitute.org/sitemap.xml.

  - id: youtube
    name: "Whitelisted YouTube channels"
    type: video
    base_url: "https://www.youtube.com/"
    status: backlog
    catalog_level: "One record per video."
    channels: []          # owner supplies channel IDs; nothing is harvested until then
    notes: "Backlog. No channel list yet."

# Institutes offering courses. The owner named the Shia Research Institute and Tasneem
# Institute as examples but has not supplied their websites. Do not guess addresses.
# Institutes offering courses. Every course record uses one of these names as its provider.
institutes:
  - name: "Mizan Institute"
    base_url: "https://mizaninstitute.org/"
    status: active
    notes: >
      Supplied by the owner on 2026-11-12. WordPress site; robots.txt (read 2026-11-12) asks for
      a 10-second crawl delay and publishes a sitemap at /sitemap.xml. A separate fiqh site exists
      at fiqh.mizaninstitute.org: courses whose subject is fiqh are skipped and logged (CLAUDE.md
      section 3) unless the owner says otherwise.
  - name: "Academy for Learning Islam (ALI)"
    base_url: ""
    status: backlog
    notes: "Approved by the owner on 2026-11-12, but no website has been supplied yet. Do not guess it."
