# Approved sources. Nothing is cataloged unless it is listed here with status: active.
# Only the owner adds sources. Proposals go in proposals/new-sources.md.
# status: active (may be cataloged) | blocked (approved, but the site refuses automated
#         access; do not fetch until the owner resolves it) | backlog (waiting on the owner)
sources:
  - id: thaqalayn.net
    name: "Thaqalayn"
    type: hadith-collections
    base_url: "https://thaqalayn.net/"
    status: active
    catalog_level: "One record per collection/book/volume. No per-hadith records."
    notes: >
      thaqalayn.net permanently redirects to thaqalayn.com (checked 2026-11-10); record URLs
      use the address the site actually serves. robots.txt allows everything except /api/
      and /super/, and publishes a sitemap.

  - id: al-islam.org
    name: "Al-Islam.org (Ahlul Bayt Digital Islamic Library Project)"
    type: library
    base_url: "https://al-islam.org/"
    status: active
    crawl_delay_seconds: 10
    catalog_level: "One record per book or article. Beginner material first."
    notes: >
      robots.txt (read 2026-11-10) allows book and article pages, disallows /search/, /admin/,
      /user/ and similar, and asks for a 10-second delay between requests. Plain scripted
      requests (curl) from the build machine are refused by the site's Cloudflare protection,
      so pages are read one at a time with the standard web-fetch tool, never faster than the
      crawl delay, and candidate pages are found through a web search limited to this site
      (the site's own /search/ is off limits). Do not use /book/export/ or /printpdf/ URLs
      as record URLs; use the book's normal page.

  - id: sistani.org
    name: "Office of Sayyid Ali al-Sistani"
    type: fiqh
    base_url: "https://www.sistani.org/english/"
    status: active
    catalog_level: "Work, section (one page), and item (single Q&A with its own URL)."
    notes: >
      robots.txt has no disallow rules (checked 2026-11-10). Structure report:
      docs/sistani-structure.md. Every record from this source is content_tag fiqh.

  - id: khamenei.ir
    name: "Office of Sayyid Ali Khamenei"
    type: fiqh
    base_url: "https://khamenei.ir/"
    status: blocked
    catalog_level: "To be decided after the site's structure is inspected."
    notes: >
      Named by the owner on 2026-11-10 as the likely source for Sayyid Khamenei's rulings
      ("should work maybe"). Not reachable from the build machine on 2026-11-10: direct
      requests to khamenei.ir and english.khamenei.ir were reset, and the web-fetch tool got
      HTTP 503 for robots.txt on both. Nothing has been inspected or cataloged. Before any
      cataloging: read robots.txt, inspect and report the structure (which section holds the
      English rulings, URL patterns, per-question links), and confirm with the owner.

  - id: duas.org
    name: "Duas.org"
    type: duas
    base_url: "https://www.duas.org/"
    status: active
    catalog_level: "To be decided after the site's structure is inspected (suggested: one record per dua or ziyarat page)."
    notes: >
      Approved by the owner on 2026-11-12. Reachable by plain requests (checked 2026-11-12);
      /robots.txt returns 404 (no rules) and there is no sitemap.xml, so pages must be found by
      following links from the home page. The home page is mostly an index of static .htm pages.
      Owner decision 2026-11-15: catalog only dua, ziyarat, munajat, salawaat, taqeebat and a'mal pages;
      no biographies, index pages, history, month overviews or health pages.
      Structure not inspected yet: before cataloging, read the main sections, report the URL
      patterns and what content type tags fit (not fiqh; use headings under duas-ziyarat).

  - id: imam-us.org
    name: "Imam Mahdi Association of Marjaeya (I.M.A.M.)"
    type: library
    base_url: "https://imam-us.org/"
    status: active
    catalog_level: "One record per article, book, video or Q&A page. Owner decision 2026-11-12: the site's fiqh pages present Sayyid Sistani's rulings, so every fiqh record from it has marja sistani."
    notes: >
      Owner decision 2026-11-12: nothing from this site is flagged for review, whatever the content.
      Supplied by the owner on 2026-11-12. WordPress site. robots.txt (read 2026-11-12) only
      blocks /wp-admin and invoice uploads; no crawl delay. Sections include announcements and
      news (out of scope), articles, books, video, and fiqh categories ("everyday-fiqh",
      "from-the-marja", "what-should-i-do"). The home page also lists /arabic and /farsi
      (other languages: skip). Be polite: one request every 2 seconds at most.

  - id: almizan.org
    name: "Tafsir al-Mizan in English (almizan.org)"
    type: library
    base_url: "https://almizan.org/"
    status: active
    catalog_level: "To be decided after inspection (suggested: the commentary as a work, one section per surah or chapter page, plus its reader guides)."
    notes: >
      Supplied by the owner on 2026-11-12 (marked "new"). English Quran commentary of
      Allamah Tabatabai. robots.txt (read 2026-11-12) has comments about content signals but no
      Disallow or signal rules; a sitemap exists at /sitemap.xml. It is treated as a library source, not an
      institute. (The Academy for Learning Islam was dropped by the owner on 2026-11-12.) Be polite: one request every 2 seconds at most.
      2026-11-12: the site's copyright page (https://almizan.org/copyright/) forbids copying,
      downloading or extracting the commentary, or using it to build databases or AI models,
      without written permission. The owner decided on 2026-11-12 that a catalog of page titles,
      links and our own short descriptions, which only sends readers to the site, is not that. To
      stay inside it: catalog landing, chapter and reader-guide pages only (never the verse-group
      commentary pages); read at most a page's title and its own introductory line; never store
      page copies or quote commentary text; keep requests few and slow. The owner may still write
      to the publisher (contact form on the copyright page) to confirm.

  - id: mizaninstitute.org
    name: "Mizan Institute"
    type: courses
    base_url: "https://mizaninstitute.org/"
    status: active
    crawl_delay_seconds: 10
    catalog_level: "One record per course (type course, content_tag course, provider Mizan Institute). Not per lesson."
    notes: >
      Supplied by the owner on 2026-11-12; see the institutes list below. Fiqh-subject courses are
      skipped and logged. Sitemap: https://mizaninstitute.org/sitemap.xml.

  - id: al-m.ca
    name: "Al-Ma'arif Foundation (al-m.ca)"
    type: library
    base_url: "https://al-m.ca/"
    status: active
    catalog_level: "To be decided after inspection (suggested: one record per publication or article)."
    notes: >
      Supplied by the owner on 2026-11-15. The page titles read "Al-Maarif Foundation" with
      Publications and Humanitarian Aid sections (humanitarian pages are out of scope). WordPress
      (Yoast, Avada, Download Manager). robots.txt (read 2026-11-15) disallows only
      /wp-content/uploads/wpforms/, has no crawl delay, and lists https://al-m.ca/sitemap_index.xml
      (sub-sitemaps: post, page, wpdmpro [downloadable publications], avada_faq, category,
      author). Home page and About page text did not come back usable on 2026-11-15, so the
      structure is not inspected yet and nothing is cataloged. Be polite: one request every 2
      seconds at most. Owner decision 2026-11-19: Sayyid Muhammad Rizvi, the author of al-m.ca's material, is
      a representative of Sayyid Sistani, so fiqh pages on al-m.ca are in scope with marja sistani and
      authors [sayyid-muhammad-rizvi] (skip a fiqh page only if it names a different author). Fiqh
      records still describe the topic and never restate a ruling. When a work is also on another approved
      source (for example al-islam.org), keep both records, each linking to its own source. Never link to or record direct file downloads as the
      record URL; use the publication's own page.

  - id: academyofislam.com
    name: "Academy for Learning Islam (ALI)"
    type: library
    base_url: "https://academyofislam.com/"
    status: active
    crawl_delay_seconds: 2
    catalog_level: "To be decided after inspection (suggested: one record per publication or resource page; one per course, with provider Academy for Learning Islam)."
    notes: >
      Supplied by the owner on 2026-11-15. This is the Academy for Learning Islam, which the owner
      dropped on 2026-11-12 and has now re-added. A registered charity (Toronto and Vancouver) with
      courses (/course-archives/), publications (/publications/), Quran resources (/quran/),
      Sahifa Sajjadiyya and duas (/sahifa/, /resources/duas/), and services such as marriage
      and will writing (services are out of scope). Mostly English; some Quranic Reflections
      are in French (skip). The site never says "Twelver" but its content (Ma'sumin, Ahl al-Bayt,
      Sahifa Sajjadiyya) is Twelver Shia. The linked hadith database (hadith.academyofislam.org)
      is a separate source (id hadith.academyofislam.org, approved by the owner 2026-11-15). robots.txt (read 2026-11-15) disallows /wp-admin/
      except admin-ajax and lists https://academyofislam.com/sitemap.xml (single urlset, about
      160k characters). Be polite: one request every 2 seconds at most. If its courses are cataloged,
      each needs type course, content_tag course and provider "Academy for Learning Islam"
      (added to the institutes list). Owner decision 2026-11-15: only asynchronous (self-paced,
      recorded) courses are cataloged; live or scheduled-term classes are skipped, because they
      expire. Fiqh-subject courses are skipped and logged.

  - id: hadith.academyofislam.org
    name: "Hadith Database (Academy for Learning Islam)"
    type: hadith-collections
    base_url: "http://hadith.academyofislam.org/"
    status: active
    catalog_level: "One record per collection/book/volume. No per-hadith records (same rule as thaqalayn.net)."
    notes: >
      Approved by the owner on 2026-11-15 (linked from academyofislam.com). hadith.academyofislam.org redirects to https://rewayaat.info/ and its inner pages
      fail on the old host, so record URLs use rewayaat.info (like thaqalayn.net / .com). rewayaat.info robots.txt
      (read 2026-11-15) allows /books and disallows /v1/, /mcp and narrator filter queries. Every record is
      content_tag hadith. robots.txt returned HTTP 530 on 2026-11-15 (no rules readable); the
      home page loads. Structure not inspected yet. Be polite: one request every 2 seconds.
  - id: tasneeminstitute.org
    name: "Tasneem Institute"
    type: courses
    base_url: "https://tasneeminstitute.org/"
    status: active
    catalog_level: "One record per online course (type course, content_tag course, provider Tasneem Institute). Not per lesson."
    notes: "Supplied by the owner on 2026-11-12; see the institutes list below. Courses are on subscription (from $12/month), so price_tag is paid."

  - id: shiaresearch.ca
    name: "Shia Research Institute (University of Toronto)"
    type: courses
    base_url: "https://shiaresearch.ca/"
    status: active
    catalog_level: "One record per course or certificate programme (type course, content_tag course, provider Shia Research Institute)."
    notes: "Supplied by the owner on 2026-11-12; see the institutes list below. Read with the web-fetch tool only."

  - id: hujjahseminary.com
    name: "Hujjah Seminary"
    type: courses
    base_url: "https://hujjahseminary.com/"
    status: active
    catalog_level: "One record per course (type course, content_tag course, provider Hujjah Seminary). The FAQ page at /Home/IndexFaqs is not cataloged (see proposals/review-flags.md)."
    notes: "Supplied by the owner on 2026-11-12; see the institutes list below. Courses are $50 each, so price_tag is paid."

  - id: youtube
    name: "Whitelisted YouTube channels"
    type: video
    base_url: "https://www.youtube.com/"
    status: backlog
    catalog_level: "One record per video."
    channels: []          # owner supplies channel IDs; nothing is harvested until then
    notes: "Backlog. No channel list yet."

# Institutes offering courses. Every course record uses one of these names as its provider.
# Owner decision 2026-11-15: for every institute, only asynchronous (self-paced, recorded) courses
# are cataloged. Live classes and scheduled terms are skipped because they expire.
institutes:
  - name: "Academy for Learning Islam"
    base_url: "https://academyofislam.com/"
    status: active
    notes: >
      Re-added by the owner on 2026-11-15. Only asynchronous courses; its per-term live courses
      (/course-archives/) are skipped.
  - name: "Mizan Institute"
    base_url: "https://mizaninstitute.org/"
    status: active
    notes: >
      Supplied by the owner on 2026-11-12. WordPress site; robots.txt (read 2026-11-12) asks for
      a 10-second crawl delay and publishes a sitemap at /sitemap.xml. A separate fiqh site exists
      at fiqh.mizaninstitute.org: courses whose subject is fiqh are skipped and logged (CLAUDE.md
      section 3) unless the owner says otherwise.
  - name: "Shia Research Institute"
    base_url: "https://shiaresearch.ca/"
    status: active
    notes: >
      Supplied by the owner on 2026-11-12 (Shia Research Institute, SRI, at the University of
      Toronto). robots.txt (read 2026-11-12) allows everything except wpforms uploads and
      publishes https://shiaresearch.ca/sitemap_index.xml. Plain scripted requests (curl) get HTTP
      406 from the site's Mod_Security, so pages are read with the web-fetch tool, one at a time
      and slowly, as for al-islam.org. Structure not inspected yet.
  - name: "Tasneem Institute"
    base_url: "https://tasneeminstitute.org/"
    status: active
    notes: >
      Supplied by the owner on 2026-11-12. robots.txt (read 2026-11-12) allows everything and
      publishes https://tasneeminstitute.org/sitemap.xml (one flat sitemap: about 40 pages under
      /courses/, plus /in-person-courses/ and /learning-paths/). Be polite: one request every 2
      seconds at most. Fiqh-subject courses (for example Introduction to Islamic Law, Laws of
      Fasting, The Fiqh of Food) are skipped and logged under the open institute-fiqh question.
  - name: "Hujjah Seminary"
    base_url: "https://hujjahseminary.com/"
    status: active
    notes: >
      Supplied by the owner on 2026-11-12. robots.txt returns 404 (no rules); no sitemap found.
      An online course platform: courses at /Courses and /Course/<id>, teachers at /Teacher/<id>.
      The owner expected a fiqh Q&A section (probably Sistani); the site's only Q&A page
      (/Home/IndexFaqs) is a FAQ about enrolling, not rulings. Fiqh appears as ordinary
      courses (for example "Islamic Law (Fiqh) - 01"), which are skipped and logged. Report to
      the owner before cataloging anything.
