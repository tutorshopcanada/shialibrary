# Search settings for the static search page.
#
# scripts/build_index.py copies this file into site/data/index.json, and
# site/js/search.js reads it from there. Nothing here involves a model:
# every number is a plain threshold or weight used by hand-written rules.
# After changing anything, rebuild the index and run:
#     python3 scripts/build_index.py && node scripts/eval_search.mjs

# ---------------------------------------------------------------------------
# Layer 1: curated starter questions and topic headings
# ---------------------------------------------------------------------------
layer1:
  # How alike the query and a starter question (or one of its alt_phrasings)
  # must be to count as a strong match. Measured as the overlap of their key
  # words (0 = nothing shared, 1 = same key words). Raise to be stricter.
  question_min_similarity: 0.8
  # A topic heading matches when the whole query is one of its labels or
  # alternate terms (after normalization). No number to tune.
  # How many starter questions to list under a matched topic heading.
  heading_max_questions: 4

# ---------------------------------------------------------------------------
# Layer 2: keyword search (BM25-style ranking)
# ---------------------------------------------------------------------------
layer2:
  # How much a keyword hit counts in each part of a record.
  # Rule from the project brief: title > sample_questions > description.
  field_weights:
    title: 3.0              # the record's title / the question as shown on the page
    sample_questions: 2.0   # beginner questions written by the cataloger
    headings: 1.5           # labels + alternate terms of the record's own subject headings
    scholars: 1.5           # author / marja names and all their spelling variants
    description: 1.0        # the 1-3 sentence description
    ancestor_headings: 0.6  # labels + alternate terms of parent headings (inherited upward)
    context: 0.5            # titles of the parent section and work
    other: 0.3              # source name, location, original-language title, provider
  # Standard BM25 constants. k1: how quickly repeated words stop adding score.
  # b: how much long fields are penalised (0 = not at all, 1 = fully).
  bm25:
    k1: 1.2
    b: 0.75
  # Prefix matching: "pray" also finds "prayer", at a reduced weight.
  prefix:
    enabled: true
    min_length: 3           # do not prefix-expand words shorter than this
    weight: 0.4             # a prefix hit counts this fraction of a whole-word hit
    max_expansions: 40      # cap on how many longer words one prefix may expand to
  # Bonus for records tagged with a heading (or written by a scholar) that the
  # query names through any of its alternate terms. Multiplied by the number of
  # query words the alternate term covers. (Raised from 2.5 on 2026-11-11: word-hit scores
  # grow with catalog size, so the bonus must keep pace or topic tags stop leading.)
  concept_weight: 3.5
  # A topic heading (or scholar) gives its full bonus only when it covers at most this many records; broader
  # headings give less, falling with the log of their size, so "Marriage and family" (291 records) cannot flood a
  # search for "temporary marriage". (Phase B, 2026-11-19.)
  concept_full_weight_max_records: 50
  # Score multiplier when the whole query appears word-for-word in the title,
  # sample questions or description.
  phrase_boost: 1.6
  # Score multiplier when every word of a page's main title (before a colon, ignoring "(Vol. 1)" and "al") is in
  # the query: someone typing a book's name gets that book. (Phase B, 2026-11-19.)
  title_match_boost: 2.0
  # Pass rule. Layer 2 is "confident" only when BOTH hold for the best result;
  # otherwise the page falls through to Layer 4 (graceful fallback).
  min_score: 1.0            # lowest acceptable score for the best result
  min_term_coverage: 0.5    # best result must match at least this share of the query's key words
  min_results: 1            # at least this many results must be found
  # A result must match at least this share of the query's key words to be
  # listed at all. Stops long questions pulling in records that share one word.
  min_result_coverage: 0.34
  # A related result must also score at least this fraction of the best result's
  # score. Cuts the long tail of records that only share one common word.
  # (Exact matches are never cut by this.)
  min_relative_score: 0.15
  # Never show more than this many results for one query.
  max_results: 150
  # Never keep more than this many related results (exact matches are not capped by this).
  max_related: 40

# ---------------------------------------------------------------------------
# Exact matches vs related results (plain rules, no model)
# ---------------------------------------------------------------------------
exact:
  # Very common words are ignored when deciding what the "key terms" are.
  stopwords: [a, an, the, of, in, on, at, to, "for", from, by, with, about, and, or,
              is, are, was, were, be, been, am, do, does, did, can, could, should,
              would, will, may, i, we, you, they, he, she, it, my, our, your, their,
              me, us, what, why, how, who, whom, when, where, which, that, this,
              these, those, there, if, as, so, not, "no", any, some, have, has, had,
              get, "one", go, goes, going, went]
  # Words that describe the whole catalog. Every record is about Shia Islam, so
  # these are not required to appear in a title for a result to count as exact.
  # (They are still used for ranking.)
  generic_terms: [shia, shias, "shi'a", shiite, shiites, shii, shiism, islam,
                  islamic, muslim, muslims, twelver, twelvers]
  # A heading's other terms may stand in for a query word in the exact-match rule only for headings with at most
  # this many records, or when the whole query is that topic. (Phase B, 2026-11-19.)
  heading_substitution_max_records: 120

# ---------------------------------------------------------------------------
# Ranking: beginner-first ordering
# ---------------------------------------------------------------------------
ranking:
  # Which order the page uses until the visitor changes the toggle.
  # beginner = "I'm new" (simpler material first); deeper = deeper material first.
  default_order: beginner
  # Whole books and topic pages rank above single questions of equal relevance, so a broad
  # search ("prayer", "khums") leads with the overview and not with one narrow question.
  granularity_boost:
    work: 1.4   # 2026-11-19: lowered from 3.0 (measured: books outranked the specific page people wanted;
    section: 1.16  # hold-out MRR 0.30 -> 0.42). Broad topic searches still lead with overviews via Layer 1.
    item: 1.0
  # Per-source overrides. thaqalayn chapters are narrow pages (one chapter of a hadith book), so they
  # count like single questions, not like whole chapters of a book.
  granularity_boost_by_source:
    # imam-us.org lists every Q&A, video and article as a stand-alone work; these are narrow pages, so they get no book
    # boost and a broad search ("prayer") leads with the overview.
    imam-us.org:
      work_types: {qa: 1.0, video: 1.0, article: 1.0}
    thaqalayn.net:
      section: 1.0
  # Exact matches: "boost" multiplies relevance by the level multipliers below, so a
  # beginner record wins when relevance is similar, but a page that actually contains the
  # searched words is not buried under easier pages that only share its topic.
  # "strict" lists every beginner record first, then intermediate, then advanced.
  exact_group_order: boost
  # Related results always use multipliers, so a loosely related beginner item
  # cannot jump over a closely related advanced one by level alone.
  level_boost:              # used when the order is "beginner" (2026-11-19: 1.5/1.2 -> 1.25/1.1, measured)
    beginner: 1.25
    intermediate: 1.1
    advanced: 1.0
  deeper_boost:             # used when the order is "deeper"
    beginner: 1.0
    intermediate: 1.2
    advanced: 1.5

# ---------------------------------------------------------------------------
# Content tag chips
# ---------------------------------------------------------------------------
tags:
  # Left-to-right order of the tag chips (after "All").
  order: [fiqh, hadith, book, article, course, lecture, other]
  # Text shown on the badge and chip for each content_tag.
  labels:
    fiqh: Fiqh
    hadith: Hadith
    book: Book
    article: Article
    course: Course
    lecture: Lecture
    other: Other

# ---------------------------------------------------------------------------
# Result tabs on the search page (owner request, 2026-11-19)
# ---------------------------------------------------------------------------
# Tab order is the priority order: Q&A first, then articles, books, hadith, then everything else.
# A record's tab comes from its format (`type`), then its content tag; anything left goes to `fallback`.
# (Q&A covers sistani.org and al-islam.org questions and answers alike.)
categories:
  order: [qa, article, book, hadith, more]
  labels:
    qa: "Q&A"
    article: Articles
    book: Books
    hadith: Hadith
    more: Courses and more
  by_type:
    qa: qa
    article: article
    book: book
    hadith-collection: hadith
  by_tag:
    hadith: hadith
  fallback: more
  # On the "All" tab, how many results to show for each kind before "See all".
  overview_per_category: 3

# Text shown on the level badge.
levels:
  order: [beginner, intermediate, advanced]
  labels:
    beginner: Beginner
    intermediate: Intermediate
    advanced: Advanced

# ---------------------------------------------------------------------------
# Hierarchy grouping
# ---------------------------------------------------------------------------
grouping:
  # When at least this many items (e.g. Q&A) from the same section match, they
  # are collapsed under the section, best match first, with an expand control.
  min_items: 3
  # Pages from the same source whose titles have the same words (ignoring numbers and common words) are shown as
  # one result with "N similar pages from the same source", e.g. one yearly reminder per year. (Phase B.)
  collapse_duplicates: true

# ---------------------------------------------------------------------------
# Layer 3: "related by meaning" (site/js/semantic.js). Consulted only when keyword search is weak.
# A small open-source model measures similarity between the query and each record on the visitor's own
# device. It never writes text. Vectors are built by scripts/build_vectors.mjs.
# ---------------------------------------------------------------------------
layer3:
  enabled: true
  max_exact: 2          # weak = fewer than this many exact keyword matches
  min_similarity: 0.46  # the best record must reach this cosine similarity, else nothing is shown
  relative_floor: 0.82  # other records must reach this fraction of the best similarity
  boost_strength: 0.2   # how much the beginner-first and book-first boosts count for in meaning ranking (0 = not at all)
  max_related: 30       # size of the fused "Related results" list
  fusion_k: 20          # reciprocal-rank-fusion constant (higher = flatter blend of keyword and meaning)
  candidates: 80        # nearest records handed over before filtering
